<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/vendor/d3.min.js"></script>
    <script src="assets/data/world-data.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: #08131f;
      }
      body {
        color: #f3ecd8;
        font-family: "IBM Plex Mono", monospace;
      }
      #world-brief {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #08131f;
        isolation: isolate;
      }
      #globe-layer {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        display: block;
      }
      #globe-layer { z-index: 1; opacity: 0.96; }
      .ambient-wash {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(8,19,31,0.04) 0%, rgba(8,19,31,0.76) 59%, #08131f 100%),
          radial-gradient(circle at 25% 26%, rgba(244,184,96,0.14), transparent 33%),
          radial-gradient(circle at 84% 72%, rgba(120,149,165,0.14), transparent 35%);
      }
      .edge-frame {
        position: absolute;
        inset: 42px;
        z-index: 12;
        pointer-events: none;
        border: 2px solid rgba(120,149,165,0.32);
      }
      .edge-frame::before, .edge-frame::after {
        content: "";
        position: absolute;
        width: 80px;
        height: 10px;
        background: #f4b860;
      }
      .edge-frame::before { top: -6px; left: 56px; }
      .edge-frame::after { right: 56px; bottom: -6px; }
      .brief-header {
        position: absolute;
        top: 92px;
        left: 72px;
        right: 72px;
        z-index: 6;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 64px;
        border-bottom: 3px solid #7895a5;
        color: #f3ecd8;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .brief-header .desk { display: inline-flex; align-items: center; gap: 16px; }
      .live-dot {
        width: 14px;
        height: 14px;
        display: inline-block;
        border-radius: 50%;
        background: #f4b860;
        box-shadow: 0 0 24px rgba(244,184,96,0.72);
      }
      .edition { color: #b8c6c9; font-size: 20px; font-weight: 400; }
      #hook-stage, #story-cards, #end-stage {
        position: absolute;
        inset: 0;
        z-index: 5;
      }
      #hook-stage {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 240px 72px 340px;
      }
      .hook-kicker {
        margin: 0 0 30px;
        color: #f4b860;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .hook-title {
        max-width: 900px;
        margin: 0;
        color: #f3ecd8;
        font-family: "League Gothic", sans-serif;
        font-size: 184px;
        font-weight: 400;
        line-height: 0.84;
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }
      .hook-title span { color: #f4b860; }
      .hook-subtitle {
        max-width: 760px;
        margin: 46px 0 0;
        color: #b8c6c9;
        font-size: 25px;
        font-weight: 700;
        line-height: 1.42;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .hook-rule {
        width: 238px;
        height: 8px;
        margin-top: 42px;
        background: #f4b860;
        box-shadow: 18px 0 0 #7895a5, 36px 0 0 #18374a;
      }
      .story-card {
        position: absolute;
        top: 1030px;
        left: 72px;
        right: 72px;
        height: 690px;
        padding: 38px 50px 44px;
        border: 3px solid #7895a5;
        border-top-color: #f4b860;
        background: rgba(8,19,31,0.9);
        box-shadow: 22px 22px 0 rgba(11,28,42,0.74);
        opacity: 0;
        transform: translateX(150px);
      }
      .story-card::before {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 170px;
        height: 170px;
        border-left: 3px solid rgba(244,184,96,0.52);
        border-bottom: 3px solid rgba(244,184,96,0.52);
      }
      .story-card .story-topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding-bottom: 24px;
        border-bottom: 2px solid rgba(120,149,165,0.62);
        color: #b8c6c9;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .story-card .story-number { color: #f4b860; }
      .story-card .story-region { text-align: right; }
      .story-card .story-headline {
        max-width: 850px;
        margin: 36px 0 0;
        color: #f3ecd8;
        font-family: "League Gothic", sans-serif;
        font-size: 88px;
        font-weight: 400;
        line-height: 0.9;
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }
      .story-card .story-deck {
        max-width: 790px;
        margin: 28px 0 0;
        color: #b8c6c9;
        font-size: 24px;
        font-weight: 400;
        line-height: 1.38;
      }
      .story-card .story-bottom {
        position: absolute;
        left: 50px;
        right: 50px;
        bottom: 38px;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        color: #b8c6c9;
        font-size: 20px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .story-card .story-source { color: #f4b860; font-weight: 700; }
      .story-card .story-code { color: #f3ecd8; font-size: 38px; font-weight: 700; }
      #end-stage {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 250px 72px 340px;
        opacity: 0;
        transform: translateY(90px);
      }
      .end-label {
        margin: 0 0 28px;
        color: #f4b860;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .end-title {
        max-width: 850px;
        margin: 0;
        color: #f3ecd8;
        font-family: "League Gothic", sans-serif;
        font-size: 152px;
        font-weight: 400;
        line-height: 0.88;
        text-transform: uppercase;
      }
      .end-copy {
        max-width: 740px;
        margin: 48px 0 0;
        color: #b8c6c9;
        font-size: 27px;
        line-height: 1.45;
      }
      .side-ticks {
        position: absolute;
        top: 260px;
        right: 42px;
        bottom: 280px;
        z-index: 8;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 18px;
      }
      .side-ticks span { display: block; width: 18px; height: 4px; background: #7895a5; }
      .side-ticks span:nth-child(3n) { width: 44px; background: #f4b860; }
      #end-wash {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        background: #08131f;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="world-brief" data-composition-id="world-brief" data-start="0" data-duration="53.5" data-width="1080" data-height="1920" data-fps="30">
        <canvas id="globe-layer" width="1080" height="1920" aria-hidden="true" data-layout-ignore></canvas>
      <div class="ambient-wash" data-layout-ignore></div>
      <div class="edge-frame" data-layout-ignore></div>

      <header class="brief-header" id="brief-header">
        <div class="desk"><span class="live-dot"></span> World desk</div>
        <div class="edition">24 Jul 2026 · 10 stories</div>
      </header>

      <section id="hook-stage">
        <p class="hook-kicker">Morning world briefing</p>
        <h1 class="hook-title">Good morning,<br><span>bad news.</span></h1>
        <p class="hook-subtitle">Ten stories shaping the world right now.</p>
        <div class="hook-rule" data-layout-ignore></div>
      </section>

      <section id="story-cards" aria-label="Top ten world stories"></section>

      <section id="end-stage">
        <p class="end-label">That’s the world briefing</p>
        <h2 class="end-title">Stay informed.<br>Stay human.</h2>
        <p class="end-copy">Sources: 10 Things Global News, AnewZ, Al Jazeera and Reuters reporting referenced in today’s edition.</p>
      </section>

      <audio id="world-brief-audio" class="clip" data-start="0" data-duration="53.5" data-track-index="20" data-volume="1" src="assets/narration/world-brief.wav"></audio>
      <div class="side-ticks" id="side-ticks" data-layout-ignore>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div id="end-wash" data-layout-ignore></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["world-brief"] = gsap.timeline({ paused: true });
    </script>
    <script type="module" src="assets/world-brief-renderer.js"></script>
  </body>
</html>
