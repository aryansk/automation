<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Globe-Only Animation Sample — Portrait</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: #2d4b3c; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #2d4b3c; }
      canvas#globe-layer, canvas#sample-canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
      canvas#globe-layer { z-index: 0; }
      canvas#sample-canvas { z-index: 1; }
      .chrome { position: absolute; z-index: 3; top: 90px; left: 72px; right: 72px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
      .brand { font: 700 30px "IBM Plex Mono", monospace; letter-spacing: 0.18em; color: #d8e1d4; }
      .format-mark { font: 700 24px "IBM Plex Mono", monospace; letter-spacing: 0.12em; color: #e2b582; }
      .sample-flag { position: absolute; z-index: 3; top: 170px; left: 72px; font: 700 24px "IBM Plex Mono", monospace; color: #f0a08f; letter-spacing: 0.16em; }
      .bottom { position: absolute; z-index: 3; bottom: 320px; left: 72px; right: 72px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
      #sample-label { font: 700 32px "IBM Plex Mono", monospace; color: #f5f0df; letter-spacing: 0.1em; }
      #sample-source { font: 400 22px "IBM Plex Mono", monospace; color: #b4c4b6; margin-top: 12px; }
      #sample-counter { font: 700 28px "IBM Plex Mono", monospace; color: #e2b582; letter-spacing: 0.1em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="globe-sample-portrait" data-start="0" data-duration="44.8" data-width="1080" data-height="1920">
      <section id="globe-sample-scene" class="clip" data-start="0" data-duration="44.8" data-track-index="0" data-hf-id="globe-sample-scene">
        <canvas id="globe-layer" width="1080" height="1920" aria-hidden="true" data-layout-ignore></canvas>
        <canvas id="sample-canvas" width="1080" height="1920" data-layout-ignore></canvas>
        <div class="chrome" data-layout-allow-overlap>
          <div class="brand">Globe-Only Motion Library</div>
          <div class="format-mark">Portrait / 1080×1920</div>
        </div>
        <div class="sample-flag" data-layout-allow-overlap>Sample data only — globe projection</div>
        <div class="bottom" data-layout-allow-overlap>
          <div>
            <div id="sample-label" class="sample-label">COUNTRY-LOCK / CAMERA / GLOBE</div>
            <div id="sample-source">Illustrative sample data — not reporting</div>
          </div>
          <div id="sample-counter">01 / 14</div>
        </div>
      </section>
    </div>
    <script src="assets/vendor/d3.min.js"></script>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/data/world-data.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["globe-sample-portrait"] = gsap.timeline({ paused: true });
    </script>
    <script type="module">
      import { bootGlobeSample } from "./assets/animations/globe-sample.js";
      bootGlobeSample({ format: "portrait" });
    </script>
  </body>
</html>
