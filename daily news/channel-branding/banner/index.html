<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=2560, height=1440">
    <link rel="preload" as="font" href="assets/fonts/league-gothic-400.ttf" crossorigin>
    <link rel="preload" as="font" href="assets/fonts/ibm-plex-mono-700.ttf" crossorigin>
    <link rel="stylesheet" href="brand.css">
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/d3.min.js"></script>
    <script src="assets/data/world-data.js"></script>
  </head>
  <body>
    <div id="root" class="brand-banner" data-composition-id="channel-branding-banner" data-start="0" data-duration="1" data-width="2560" data-height="1440">
      <div class="brand-grid" aria-hidden="true"></div>
      <canvas id="space-layer" width="2560" height="1440" aria-hidden="true"></canvas>
      <canvas id="globe-layer" width="2560" height="1440" aria-hidden="true"></canvas>

      <div class="brand-rail">
        <span class="brand-rail__desk"><span class="brand-rail__dot"></span> DAILY GLOBAL NEWS</span>
        <span>WORLD / LIVE CONTEXT</span>
      </div>
      <div class="brand-rail__rule" aria-hidden="true"></div>

      <div class="news-deck" data-layout-allow-overlap>
        <div class="news-deck__head"><span>NEWS FLOW / 24H</span><span>GOOD + BAD</span></div>
        <div class="news-deck__row news-deck__row--good">
          <span class="news-deck__dot"></span>
          <strong>GOOD NEWS</strong>
          <span class="news-deck__bar"><i></i></span>
          <span class="news-deck__code">01 / G</span>
        </div>
        <div class="news-deck__row news-deck__row--bad">
          <span class="news-deck__dot"></span>
          <strong>BAD NEWS</strong>
          <span class="news-deck__bar"><i></i></span>
          <span class="news-deck__code">02 / B</span>
        </div>
        <div class="news-deck__footer">One world · multiple signals · context first</div>
      </div>

      <div class="brand-copy" data-layout-allow-overlap>
        <svg class="brand-route" viewBox="0 0 390 90" aria-hidden="true" data-layout-ignore>
          <path class="brand-route__ghost" d="M10 70 C76 22 142 32 196 54 C248 75 306 54 380 13"></path>
          <path class="brand-route__line" d="M10 70 C76 22 142 32 196 54 C248 75 306 54 380 13"></path>
          <circle cx="10" cy="70" r="6"></circle>
          <circle cx="196" cy="54" r="6"></circle>
          <circle cx="380" cy="13" r="6"></circle>
          <text x="5" y="88">GOOD</text>
          <text x="171" y="78">BAD</text>
          <text x="326" y="38">CONTEXT</text>
        </svg>
        <span class="brand-copy__eyebrow">MAP-LED DAILY NEWS / EDITORIAL DESK</span>
        <h1>GOOD NEWS<br><em>BAD NEWS</em></h1>
        <span class="brand-copy__sub">THE WORLD, MAPPED AND EXPLAINED.</span>
        <span class="brand-copy__foot">ONE STORY AT A TIME · SOURCES IN EVERY DESCRIPTION</span>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["channel-branding-banner"] = gsap.timeline({ paused: true });
    </script>
    <script type="module" src="brand-renderer.js"></script>
  </body>
</html>
