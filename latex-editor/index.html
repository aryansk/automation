<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LaTeX Editor</title>
<style>
  :root {
    --bg: #1e1e2e; --panel: #26263a; --panel2: #2f2f47; --border: #3a3a55;
    --text: #e6e6f0; --muted: #9a9ab5; --accent: #7c6cff; --accent2: #5ac8fa;
    --err: #ff6b6b; --ok: #4ade80; --font-mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex: none;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header h1 .tex { color: var(--accent2); }
  .spacer { flex: 1; }
  button, select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    font-family: inherit; transition: background .15s, border-color .15s;
  }
  button:hover:not(:disabled) { background: #3a3a5a; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #6a58ff; }
  #status { font-size: 12px; color: var(--muted); min-width: 130px; }
  #status.busy { color: var(--accent2); }
  #status.err { color: var(--err); }
  #status.ok { color: var(--ok); }

  main { flex: 1; display: flex; min-height: 0; }
  .pane { display: flex; flex-direction: column; min-width: 0; }
  .editor-pane { width: 46%; border-right: 1px solid var(--border); }
  .preview-pane { flex: 1; }
  .pane-head {
    padding: 5px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--muted); background: var(--panel); border-bottom: 1px solid var(--border); flex: none;
  }
  #source {
    flex: 1; width: 100%; resize: none; border: 0; outline: 0; padding: 14px;
    background: #191926; color: var(--text); font-family: var(--font-mono);
    font-size: 13.5px; line-height: 1.55; tab-size: 2;
  }
  #preview { flex: 1; border: 0; width: 100%; background: #52526a; }
  .empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px; text-align: center; padding: 20px;
  }
  #logwrap {
    flex: none; max-height: 30%; overflow: auto; display: none;
    border-top: 1px solid var(--border); background: #14141f;
  }
  #logwrap.show { display: block; }
  #log {
    margin: 0; padding: 10px 14px; font-family: var(--font-mono);
    font-size: 12px; color: #c9c9dd; white-space: pre-wrap; word-break: break-word;
  }
  .toggle { font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>La<span class="tex">TeX</span> Editor</h1>
  <button id="compile" class="primary" disabled>⟳ Compile (⌘↵)</button>
  <button id="download" disabled>↓ PDF</button>
  <span id="status">Loading engine…</span>
  <div class="spacer"></div>
  <button id="togglelog" class="toggle">Log</button>
  <button id="reset" class="toggle">Reset sample</button>
</header>

<main>
  <section class="pane editor-pane">
    <div class="pane-head">main.tex</div>
    <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  </section>
  <section class="pane preview-pane">
    <div class="pane-head">Preview</div>
    <iframe id="preview" style="display:none"></iframe>
    <div id="empty" class="empty">Press <b>&nbsp;Compile&nbsp;</b> to render your document as a PDF.</div>
  </section>
</main>

<div id="logwrap"><pre id="log"></pre></div>

<script src="engine/PdfTeXEngine.js"></script>
<script>
// Point the engine's Web Worker at the engine/ subfolder (path resolves relative to this page).
window.ENGINE_PATH = "engine/swiftlatexpdftex.js";

const SAMPLE = String.raw`\documentclass[11pt]{article}
\usepackage[margin=1in]{geometry}
\usepackage{amsmath, amssymb}
\usepackage{xcolor}

\title{Hello, \LaTeX}
\author{Automation}
\date{\today}

\begin{document}
\maketitle

\section{Introduction}
This document is compiled entirely in your browser with a WebAssembly
build of pdf\TeX{}. Edit the source on the left and hit \textbf{Compile}.

\section{A little math}
The quadratic formula:
\[
  x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}
\]
and Euler's identity: $e^{i\pi} + 1 = 0$.

\section{A list}
\begin{itemize}
  \item First point
  \item Second point
  \item \textcolor{blue}{A colourful third point}
\end{itemize}

\end{document}
`;

const $ = (id) => document.getElementById(id);
const source = $("source");
const statusEl = $("status");
const compileBtn = $("compile");
const downloadBtn = $("download");
const preview = $("preview");
const empty = $("empty");
const logEl = $("log");
const logWrap = $("logwrap");

let engine = null;
let lastPdfUrl = null;
let lastPdfBytes = null;
let compiling = false;

source.value = localStorage.getItem("latex-editor:source") || SAMPLE;
source.addEventListener("input", () => localStorage.setItem("latex-editor:source", source.value));

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = cls || "";
}

// Tab inserts two spaces instead of moving focus.
source.addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const s = source.selectionStart, en = source.selectionEnd;
    source.value = source.value.slice(0, s) + "  " + source.value.slice(en);
    source.selectionStart = source.selectionEnd = s + 2;
  }
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); compile(); }
});

async function initEngine() {
  try {
    engine = new exports.PdfTeXEngine();
    await engine.loadEngine();
    setStatus("Ready", "ok");
    compileBtn.disabled = false;
  } catch (err) {
    setStatus("Engine failed to load", "err");
    showLog("Failed to load the pdfTeX engine.\nAre you serving this over http:// (not file://)?\n\n" + err);
  }
}

function showLog(text) {
  logEl.textContent = text || "";
  logWrap.classList.add("show");
}

async function compile() {
  if (!engine || compiling) return;
  compiling = true;
  compileBtn.disabled = true;
  downloadBtn.disabled = true;
  setStatus("Compiling…", "busy");
  try {
    engine.writeMemFSFile("main.tex", source.value);
    engine.setEngineMainFile("main.tex");
    const t0 = performance.now();
    const r = await engine.compileLaTeX();
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    showLog(r.log || "");
    if (r.status === 0 && r.pdf) {
      lastPdfBytes = r.pdf;
      if (lastPdfUrl) URL.revokeObjectURL(lastPdfUrl);
      lastPdfUrl = URL.createObjectURL(new Blob([r.pdf], { type: "application/pdf" }));
      empty.style.display = "none";
      preview.style.display = "block";
      preview.src = lastPdfUrl;
      downloadBtn.disabled = false;
      setStatus(`Compiled in ${secs}s`, "ok");
    } else {
      setStatus(`Errors (status ${r.status}) — see Log`, "err");
      logWrap.classList.add("show");
    }
  } catch (err) {
    setStatus("Compile crashed", "err");
    showLog(String(err));
  } finally {
    compiling = false;
    compileBtn.disabled = false;
  }
}

compileBtn.addEventListener("click", compile);
downloadBtn.addEventListener("click", () => {
  if (!lastPdfBytes) return;
  const a = document.createElement("a");
  a.href = lastPdfUrl;
  a.download = "document.pdf";
  a.click();
});
$("togglelog").addEventListener("click", () => logWrap.classList.toggle("show"));
$("reset").addEventListener("click", () => {
  if (confirm("Replace the editor contents with the sample document?")) {
    source.value = SAMPLE;
    localStorage.setItem("latex-editor:source", SAMPLE);
  }
});

initEngine();
</script>
</body>
</html>
