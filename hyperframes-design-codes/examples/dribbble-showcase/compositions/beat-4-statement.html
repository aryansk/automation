    <style>

    <div class="content-wrapper">

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var tl = gsap.timeline({ paused: true });
        window.__timelines["beat-4-statement"] = tl;

        var root = document.querySelector(
          '[data-composition-id="beat-4-statement"]',
        );
        var contentWrapper = root.querySelector(".content-wrapper");
        var bgGrid = root.querySelector(".bg-grid");
        var line1 = root.querySelector(".headline-line-1");
        var line2 = root.querySelector(".headline-line-2");
        var divider = root.querySelector(".pink-divider");
        var logo = root.querySelector(".logo-watermark");
        var dots = root.querySelectorAll(".orbit-dot");

        // Ellipse parameters for orbiting dots
        var centerX = 960;
        var centerY = 540;
        var radiusX = 520;
        var radiusY = 320;

        // Place dots at initial positions (evenly spaced at 45 deg apart)
        for (var i = 0; i < 8; i++) {
          var angle = (i * 45 * Math.PI) / 180;
          var x = centerX + radiusX * Math.cos(angle);
          var y = centerY + radiusY * Math.sin(angle);
          gsap.set(dots[i], { left: x, top: y, opacity: 0 });
        }

        // --- ENTRY from whip pan ---
        // 0.0s: Everything starts at x:600, blur:24, decelerates to rest
        tl.fromTo(
          contentWrapper,
          { x: 600, filter: "blur(24px)" },
          { x: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out" },
          0,
        );

        // --- Line 1 STAMPS in at 0.2s ---
        tl.fromTo(
          line1,
          { scale: 1.15, opacity: 0 },
          {
            scale: 1,
            opacity: 1,
            duration: 0.35,
            ease: "back.out(1.4)",
          },
          0.2,
        );

        // --- Pink divider draws from center at 0.5s ---
        tl.fromTo(
          divider,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.5, ease: "power2.inOut" },
          0.5,
        );

        // --- Line 2 STAMPS in at 1.0s ---
        tl.fromTo(
          line2,
          { scale: 1.15, opacity: 0 },
          {
            scale: 1,
            opacity: 1,
            duration: 0.35,
            ease: "back.out(1.4)",
          },
          1.0,
        );

        // --- Orbiting dots begin at 1.2s ---
        // Each dot orbits along the ellipse. We animate from its starting angle
        // through half a rotation (4s visible out of 8s full rotation).
        // Using deterministic sin/cos keyframes via GSAP onUpdate.
        for (var i = 0; i < 8; i++) {
          (function (index) {
            var startAngle = (index * 45 * Math.PI) / 180;
            // Angular speed: full rotation in 8s → pi/4 per second → pi radians in 4s
            // We animate a proxy object's progress from 0 to 1 over 2.8s (1.2s to 4.0s)
            var proxy = { t: 0 };

            // Fade dots in
            tl.to(
              dots[index],
              {
                opacity: parseFloat(
                  getComputedStyle(dots[index]).opacity || 0.3,
                ),
                duration: 0.3,
                ease: "power1.in",
              },
              1.2 + index * 0.05,
            );

            // Restore original opacity values for the animation
            var opacities = [0.25, 0.35, 0.2, 0.3, 0.4, 0.22, 0.28, 0.35];

            tl.fromTo(
              proxy,
              { t: 0 },
              {
                t: 1,
                duration: 2.8,
                ease: "none",
                onUpdate: function () {
                  // Half rotation over the visible duration
                  var angle = startAngle + proxy.t * Math.PI;
                  var x = centerX + radiusX * Math.cos(angle);
                  var y = centerY + radiusY * Math.sin(angle);
                  gsap.set(dots[index], {
                    left: x,
                    top: y,
                    opacity: opacities[index],
                  });
                },
              },
              1.2,
            );
          })(i);
        }

        // --- Logo watermark fades in at 1.5s ---
        tl.to(
          logo,
          { opacity: 0.3, duration: 0.3, ease: "power1.in" },
          1.5,
        );

        // --- Background grid fades in at 3.0s ---
        tl.to(
          bgGrid,
          { opacity: 0.08, duration: 0.5, ease: "power1.in" },
          3.0,
        );

        // --- TRANSITION OUT at 3.67s (4.0 - 0.33) ---
        tl.to(
          contentWrapper,
          {
            y: -150,
            filter: "blur(30px)",
            opacity: 0,
            duration: 0.33,
            ease: "power2.in",
          },
          3.67,
        );
      })();
