    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var tl = gsap.timeline({ paused: true });
        window.__timelines["beat-2-community"] = tl;

        var root = document.querySelector(
          '[data-composition-id="beat-2-community"]',
        );
        var contentWrapper = root.querySelector(".content-wrapper");
        var bgScreenshot = root.querySelector(".bg-screenshot");
        var words = root.querySelectorAll(".word");
        var pinkUnderline = root.querySelector(".pink-underline");
        var dots = root.querySelectorAll(".floating-dot");

        // Entry: zoom-through landing — scale 0.75 + blur 20px → scale 1.0 + blur 0
        tl.fromTo(
          contentWrapper,
          { scale: 0.75, filter: "blur(20px)" },
          { scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
          0,
        );

        // Background: slow drift — scale 1.1 → 1.05, translateY 0 → -120px over 4s
        tl.fromTo(
          bgScreenshot,
          { scale: 1.1, y: 0 },
          { scale: 1.05, y: -120, duration: 4, ease: "none" },
          0,
        );

        // Word-by-word stagger starting at 0.5s
        tl.fromTo(
          words,
          { y: 40, opacity: 0 },
          {
            y: 0,
            opacity: 1,
            duration: 0.3,
            ease: "power2.out",
            stagger: 0.12,
          },
          0.5,
        );

        // Pink underline on "inspiration" — appears after that word lands
        // "inspiration" is the 4th word (index 3), appears at 0.5 + 3*0.12 + 0.3 = 1.16s
        tl.fromTo(
          pinkUnderline,
          { width: "0%" },
          { width: "100%", duration: 0.4, ease: "power2.out" },
          1.16,
        );

        // Floating pink dots — deterministic gentle drift
        var driftOffsets = [15, -20, 18, -12, 16];
        for (var i = 0; i < dots.length; i++) {
          tl.fromTo(
            dots[i],
            { y: 0 },
            {
              y: driftOffsets[i],
              duration: 3,
              ease: "sine.inOut",
              yoyo: true,
              repeat: 1,
            },
            0.2 + i * 0.3,
          );
        }
