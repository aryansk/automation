<template>
  <div
    data-composition-id="beat-5-close"
    data-width="1920"
    data-height="1080"
    data-start="0"
    data-duration="3"
  >
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=block");

      [data-composition-id="beat-5-close"] {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: "Inter", sans-serif;
        background: #ffffff;
      }

      [data-composition-id="beat-5-close"] .particle-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        z-index: 0;
      }

      [data-composition-id="beat-5-close"] .content-stack {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        will-change: transform, filter;
      }

      [data-composition-id="beat-5-close"] .inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      [data-composition-id="beat-5-close"] .logo {
        width: 360px;
        opacity: 0;
        will-change: transform, opacity;
      }

      [data-composition-id="beat-5-close"] .tagline {
        font-size: 32px;
        font-weight: 400;
        color: #3d3d4e;
        margin-top: 16px;
        opacity: 0;
        will-change: opacity;
      }

      [data-composition-id="beat-5-close"] .url {
        font-size: 24px;
        font-weight: 600;
        color: #ea4c89;
        margin-top: 12px;
        opacity: 0;
        will-change: opacity;
      }
    </style>

    <canvas class="particle-canvas" width="1920" height="1080"></canvas>

    <div class="content-stack">
      <div class="inner">
        <img class="logo" src="../assets/svgs/logo-0.svg" alt="Dribbble" />
        <div class="tagline"></div>
        <div class="url">dribbble.com</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var root = document.querySelector(
          '[data-composition-id="beat-5-close"]',
        );
        var canvas = root.querySelector(".particle-canvas");
        var ctx = canvas.getContext("2d");
        var contentStack = root.querySelector(".content-stack");
        var logo = root.querySelector(".logo");
        var tagline = root.querySelector(".tagline");
        var url = root.querySelector(".url");

        // Deterministic hash function
        function hash(a, b) {
          var n = a * 374761393 + b * 668265263;
          n = (n ^ (n >> 13)) * 1274126177;
          return ((n ^ (n >> 16)) & 0x7fffffff) / 0x7fffffff;
        }

        // Generate 60 particles deterministically
        var particles = [];
        for (var i = 0; i < 60; i++) {
          particles.push({
            x: hash(i, 0) * 1920,
            y: hash(i, 1) * 1080,
            size: 2 + hash(i, 2) * 4,
            opacity: 0.15 + hash(i, 3) * 0.25,
          });
        }

        // Proxy for GSAP-driven particle animation
        var proxy = { time: 0 };

        function drawParticles() {
          ctx.clearRect(0, 0, 1920, 1080);
          for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            var y = p.y - proxy.time * 30;
            // Wrap around
            y = ((y % 1080) + 1080) % 1080;
            ctx.beginPath();
            ctx.arc(p.x, y, p.size, 0, 2 * Math.PI);
            ctx.fillStyle =
              "rgba(234, 76, 137, " + p.opacity.toFixed(3) + ")";
            ctx.fill();
          }
        }

        // Draw initial frame
        drawParticles();

        // Typing animation text
        var fullTagline = "Discover what\u2019s next.";

        // Timeline
        var tl = gsap.timeline({ paused: true });

        // Particle field: animate proxy.time from 0 to 3 over 3s
        tl.to(
          proxy,
          {
            time: 3,
            duration: 3,
            ease: "none",
            onUpdate: drawParticles,
          },
          0,
        );

        // Content stack entry: decelerate from y:150, blur:30 to y:0, blur:0
        tl.fromTo(
          contentStack,
          { y: 150, filter: "blur(30px)" },
          { y: 0, filter: "blur(0px)", duration: 0.8, ease: "power2.out" },
          0,
        );

        // Logo: scale 0.9 -> 1.0, opacity 0 -> 1
        tl.fromTo(
          logo,
          { scale: 0.9, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power2.out" },
          0.3,
        );

        // Tagline: type on character by character over 0.6s
        var charCount = fullTagline.length;
        var charDuration = 0.6 / charCount;
        for (var c = 0; c < charCount; c++) {
          (function (idx) {
            var text = fullTagline.substring(0, idx + 1);
            tl.call(
              function () {
                tagline.textContent = text;
              },
              null,
              1.0 + idx * charDuration,
            );
          })(c);
        }
        // Ensure tagline is visible once typing starts
        tl.set(tagline, { opacity: 1 }, 1.0);

        // URL fade in
        tl.to(
          url,
          { opacity: 1, duration: 0.3, ease: "power1.out" },
          1.8,
        );

        // Subtle zoom on entire content area
        tl.fromTo(
          contentStack,
          { scale: 1.0 },
          { scale: 1.01, duration: 3, ease: "none" },
          0,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["beat-5-close"] = tl;
      })();
    </script>
  </div>
</template>
