<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
    </style>
  </head>
  <body>
    <div data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="20">

      <!-- Beat 1: The Mark (0-3s) -->
      <div id="beat-1" data-composition-id="beat-1-mark" data-composition-src="compositions/beat-1-mark.html" data-start="0" data-duration="3" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- Beat 2: The Community (3-7s) -->
      <div id="beat-2" data-composition-id="beat-2-community" data-composition-src="compositions/beat-2-community.html" data-start="3" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- Beat 3: The Work (7-13s) -->
      <div id="beat-3" data-composition-id="beat-3-work" data-composition-src="compositions/beat-3-work.html" data-start="7" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- Beat 4: The Statement (13-17s) -->
      <div id="beat-4" data-composition-id="beat-4-statement" data-composition-src="compositions/beat-4-statement.html" data-start="13" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- Beat 5: The Close (17-20s) -->
      <div id="beat-5" data-composition-id="beat-5-close" data-composition-src="compositions/beat-5-close.html" data-start="17" data-duration="3" data-track-index="1" data-width="1920" data-height="1080"></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
