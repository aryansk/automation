      [data-composition-id="spotify-bento"] {
        position: relative;

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ═══ PHASE 1: Title mask reveal (0–2s) ═══

      // Words start pushed below their mask boxes, slide up into view
      gsap.set("#word-jakes", { y: "110%" });
      gsap.set("#word-april", { y: "110%" });

      tl.to("#word-jakes", {
        y: "0%", duration: 0.7, ease: "power3.out",
      }, 0.3);

      tl.to("#word-april", {
        y: "0%", duration: 0.7, ease: "power3.out",
      }, 0.6);

      tl.fromTo("#word-playlist", { opacity: 0, x: -30, letterSpacing: "0.35em" }, {
        opacity: 1, x: 0, letterSpacing: "0.15em",
        duration: 0.8, ease: "expo.out",
      }, 1.1);

      // ═══ PHASE 2: Cards stagger (1.5–4s) ═══

      tl.fromTo("#card-1", { opacity: 0, scale: 0.85, filter: "blur(12px)" }, {
        opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 1.5);

      tl.fromTo("#card-2", { opacity: 0, x: 60 }, {
        opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, 1.7);

      tl.fromTo("#card-3", { opacity: 0, scale: 0.7 }, {
        opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 1.9);

      tl.fromTo("#card-9", { opacity: 0, x: 80, skewX: -8 }, {
        opacity: 1, x: 0, skewX: 0, duration: 0.6, ease: "power3.out" }, 2.1);

      tl.fromTo("#card-4", { opacity: 0, y: 50 }, {
        opacity: 1, y: 0, duration: 0.6, ease: "circ.out" }, 2.3);

      tl.fromTo("#card-5", { opacity: 0, scale: 0.9, rotation: -3 }, {
        opacity: 1, scale: 1, rotation: 0, duration: 0.65, ease: "power2.out" }, 2.5);

      tl.fromTo("#card-6", { opacity: 0, x: -80, filter: "blur(8px)" }, {
        opacity: 1, x: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 2.7);

      tl.fromTo("#card-7", { opacity: 0, y: -60 }, {
        opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.4)" }, 2.9);

      tl.fromTo("#card-10", { opacity: 0, scale: 0.8, filter: "blur(6px)" }, {
        opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "power2.out" }, 3.1);

      tl.fromTo("#card-8", { opacity: 0, scale: 0.8 }, {
        opacity: 1, scale: 1, duration: 0.6, ease: "elastic.out(1, 0.5)" }, 3.3);

      tl.fromTo("#card-11", { opacity: 0, y: 40, rotation: 4 }, {
        opacity: 1, y: 0, rotation: 0, duration: 0.55, ease: "power3.out" }, 3.5);
