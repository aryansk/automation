      <script>
        window.__timelines = window.__timelines || {};

        // ---- Living shader background (GLSL ported into the HyperFrames timeline) ----
        // Driven by the timeline playhead (not requestAnimationFrame) so every rendered
        // frame is deterministic. Plays the entire 80s behind all scenes.
        const shaderState = (function initShader() {
          const container = document.getElementById("shader-bg");
          if (!container) return null;

          const W = 1920, H = 1080;
          const canvas = document.createElement("canvas");
          canvas.width = W;
          canvas.height = H;
          canvas.style.width = "1920px";
          canvas.style.height = "1080px";
          const gl = canvas.getContext("webgl2", { premultipliedAlpha: false, antialias: true });
          if (!gl) return null;

          const VERT_SRC = `#version 300 es
            precision highp float;
            layout(location=0) in vec2 a_pos;
            out vec2 v_uv;
            void main(){
              v_uv = a_pos * 0.5 + 0.5;
              gl_Position = vec4(a_pos, 0.0, 1.0);
            }`;

          // "Cathedral" raymarch shader, inverted for light mode so the glowing
          // structures become dark strokes on white (paired with multiply blend).
          const FRAG_SRC = `#version 300 es
            precision highp float;
            out vec4 fragColor;
            in vec2 v_uv;
            uniform vec3  iResolution;
            uniform float iTime;
            uniform int   iFrame;
            uniform vec4  iMouse;
            void mainImage(out vec4 fragColor, in vec2 fragCoord){
              vec2  r  = iResolution.xy;
              float t  = iTime;
              vec3  FC = vec3(fragCoord, t);
              vec4  o  = vec4(0.0);
              vec3 p;
              for (float i, z, d; i++ < 5e1; o += (sin(p.y + vec4(6., 1., 2., 3.)) + 2.) / d / z){
                p = z * normalize(FC.rgb * 2. - r.xyx) + t;
                z += d = length(vec2(
                  length(cos(sin(.5 * p) + p).xy + 1.) - 2.,
                  min(d = p.z - t + 9., d * .1) * .5
                ));
              }
              o = tanh(o / 5e1);
              // Invert + boost contrast so the structures read as deep colored strokes on white.
              fragColor = vec4(clamp(1.0 - o.rgb * 1.9, 0.0, 1.0), 1.0);
            }
            void main(){ mainImage(fragColor, gl_FragCoord.xy); }`;

          function compile(type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
              console.error("Shader compile error:", gl.getShaderInfoLog(s));
              return null;
            }
            return s;
          }
          const vs = compile(gl.VERTEX_SHADER, VERT_SRC);
          const fs = compile(gl.FRAGMENT_SHADER, FRAG_SRC);
          if (!vs || !fs) return null;
          const prog = gl.createProgram();
          gl.attachShader(prog, vs);
          gl.attachShader(prog, fs);
          gl.linkProgram(prog);
          if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
            console.error("Program link error:", gl.getProgramInfoLog(prog));
            return null;
          }

          const vao = gl.createVertexArray();
          gl.bindVertexArray(vao);
          const vbo = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
          gl.enableVertexAttribArray(0);
          gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

          const uRes = gl.getUniformLocation(prog, "iResolution");
          const uTime = gl.getUniformLocation(prog, "iTime");
          const uFrame = gl.getUniformLocation(prog, "iFrame");
          const uMouse = gl.getUniformLocation(prog, "iMouse");
          gl.viewport(0, 0, W, H);
          container.appendChild(canvas);

          function renderAt(seconds) {
            gl.useProgram(prog);
            gl.bindVertexArray(vao);
            if (uRes) gl.uniform3f(uRes, W, H, 1.0);
            if (uTime) gl.uniform1f(uTime, seconds);
            if (uFrame) gl.uniform1i(uFrame, Math.floor(seconds * 30));
            if (uMouse) gl.uniform4f(uMouse, 0, 0, 0, 0);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
          }
          renderAt(0);
          return { renderAt };
        })();

            name: false,
            cards: [
              ["Nasdaq Close", "26,972", "▲ +8.1% in May", "Best month of 2026"],
              ["May 1 Open", "24,950", "", "Month start<br>+2,023 pts in May"],
              ["Friday Move", "+0.20%", "▲ +55 pts", "Dow +0.72%"],
              ["VIX", "15.32", "▼ Fear index low", "-2.67% Friday"],
            ],
            chartTitle: "Nasdaq — May Weekly Closes",
            chartPath: "M0 188 C155 160 245 146 380 116 S620 60 980 32",
            areaPath: "M0 188 C155 160 245 146 380 116 S620 60 980 32 L980 210 L0 210 Z",
            events: [],
          },
          ra: {
            tag: "Rates & Macro",
            nav: "pill-ra",
            bg: "assets/frames/avatar-04.jpg",
            accent: "#d98a0c",
            active: 0,
            name: false,
            cards: [
              ["10-YR Treasury", "4.44%", "▼ 2-week low", "Eased on Iran news"],
              ["PCE Inflation", "3.8% YoY", "Below forecast", "Core: 3.3%"],
              ["Fed Stance", "Hold", "", "Unchanged<br>No cuts into 2027"],
              ["Brent Crude", "$91.12", "▼ -1.70% Fri", "Iran ceasefire signal"],
            ],
            chartTitle: "10-Year Treasury Yield — Past 4 Weeks",
            chartPath: "M0 52 C150 85 270 124 395 142 S700 154 980 196",
            areaPath: "M0 52 C150 85 270 124 395 142 S700 154 980 196 L980 210 L0 210 Z",
            events: [],
          },
          wk: {
            tag: "This Week",
            nav: "pill-wk",
            bg: "assets/frames/avatar-05.jpg",
            accent: "#0bb3a0",
            active: 0,
            name: false,
            cards: [
              ["ISM Manufacturing", "June 1", "", "Kicks off the week<br>Mon morning"],
              ["ADP Payrolls", "June 3", "", "Private jobs preview<br>Wed morning"],
              ["ISM Services PMI", "June 3", "", "80% of US GDP<br>Wed morning"],
              ["Nonfarm Payrolls", "June 5", "", "Biggest number<br>Fri — moves markets"],
            ],
            chartTitle: "",
            chartPath: "",
            areaPath: "",
            events: [
              ["ISM Manufacturing", "Mon · June 1"],
              ["ADP jobs report", "Wed · June 3"],
              ["ISM Services PMI", "Wed · June 3"],
              ["Nonfarm payrolls", "Fri · June 5"],
            ],
          },
        };

        const accentGlow = {
          "#0ea882": "rgba(14, 168, 130, 0.2)",
          "#1577e0": "rgba(21, 119, 224, 0.2)",
          "#d98a0c": "rgba(217, 138, 12, 0.2)",
          "#0bb3a0": "rgba(11, 179, 160, 0.2)",
        };

        function accentFill(accent) {
          if (accent === "#d98a0c") return "rgba(217,138,12,.12)";
          if (accent === "#1577e0") return "rgba(21,119,224,.12)";
          if (accent === "#0bb3a0") return "rgba(11,179,160,.12)";
          return "rgba(14,168,130,.12)";
        }

        function setScene(key) {
          const scene = scenes[key];
          document.querySelector(".scene-tag").innerHTML = scene.tag;
          document.querySelector(".name-card").style.display = scene.name ? "block" : "none";
          document.querySelector(".scene-glow").style.background =
            `radial-gradient(58% 50% at 62% 32%, ${accentGlow[scene.accent] || accentGlow["#0ea882"]}, transparent 70%)`;
          document.querySelectorAll(".stat-card").forEach((card, index) => {
            const item = scene.cards[index];
            card.classList.toggle("active", index === scene.active);
            card.style.setProperty("--accent", scene.accent);
            // Backlit (non-headline) cards adopt the scene's accent once spoken.
            card.style.setProperty("--fill", scene.accent);
            card.style.setProperty("--fill-soft", accentGlow[scene.accent] || accentGlow["#0ea882"]);
            card.querySelector(".label").innerHTML = item[0];
            card.querySelector(".value").innerHTML = item[1];
            card.querySelector(".sub").innerHTML = item[2];
            card.querySelector(".note").innerHTML = item[3];
          });
          document.querySelector(".chart-card").style.display = scene.events.length ? "none" : "block";
          document.querySelector(".event-list").style.display = scene.events.length ? "block" : "none";
          if (!scene.events.length) {
            document.querySelector(".chart-title").textContent = scene.chartTitle;
            document.querySelector(".chart-line").setAttribute("d", scene.chartPath);
            document.querySelector(".chart-area").setAttribute("d", scene.areaPath);
            document.querySelector(".chart-line").style.stroke = scene.accent;
            document.querySelector(".chart-line").style.filter = "drop-shadow(0 4px 9px rgba(20, 45, 70, 0.14))";
            document.querySelector(".chart-area").style.fill = accentFill(scene.accent);
          } else {
            document.querySelectorAll(".event-row").forEach((row, index) => {
              const item = scene.events[index];
              row.style.display = item ? "grid" : "none";
              if (item) {
                row.querySelector("strong").textContent = item[0];
                row.querySelector("span").textContent = item[1];
              }
            });
          }
        }

        function numberText(value, kind) {
          if (kind === "int") return Math.round(value).toLocaleString("en-US");
          if (kind === "signedInt") return "+" + Math.round(value).toLocaleString("en-US");
          if (kind === "pct1") return "+" + value.toFixed(1) + "%";
          if (kind === "pct2") return "+" + value.toFixed(2) + "%";
          if (kind === "yield") return value.toFixed(2) + "%";
          if (kind === "money") return "$" + value.toFixed(2);
          if (kind === "vix") return value.toFixed(2);
          return value.toFixed(1);
        }

        function countField(selector, to, kind, at, duration, prefix, suffix) {
          const state = { value: 0 };
          tl.to(state, {
            value: to,
            duration,
            ease: "power2.out",
            onStart: () => {
              document.querySelector(selector).innerHTML = (prefix || "") + numberText(0, kind) + (suffix || "");
            },
            onUpdate: () => {
              document.querySelector(selector).innerHTML = (prefix || "") + numberText(state.value, kind) + (suffix || "");
            },
          }, at);
        }

        function countSceneNumbers(key, at, offsets) {
          if (key === "sp") {
            countField(".card-1 .value", 7580, "int", at + offsets[0] + 0.08, 0.9);
            countField(".card-1 .sub", 4.8, "pct1", at + offsets[0] + 0.2, 0.75, "▲ ", " in May");
            countField(".card-2 .value", 7230, "int", at + offsets[1] + 0.08, 0.85);
            countField(".card-3 .value", 28.2, "pct1", at + offsets[2] + 0.08, 0.85);
            countField(".card-4 .value", 12.9, "pct1", at + offsets[3] + 0.08, 0.8, "IBM ", "");
          }
          if (key === "nd") {
            countField(".card-1 .value", 26972, "int", at + offsets[0] + 0.08, 0.9);
            countField(".card-1 .sub", 8.1, "pct1", at + offsets[0] + 0.2, 0.75, "▲ ", " in May");
            countField(".card-2 .value", 24950, "int", at + offsets[1] + 0.08, 0.85);
            countField(".card-3 .value", 0.2, "pct2", at + offsets[2] + 0.08, 0.65);
            countField(".card-4 .value", 15.32, "vix", at + offsets[3] + 0.08, 0.75);
          }
          if (key === "ra") {
            countField(".card-1 .value", 4.44, "yield", at + offsets[0] + 0.08, 0.75);
            countField(".card-2 .value", 3.8, "yield", at + offsets[1] + 0.08, 0.75, "", " YoY");
            countField(".card-4 .value", 91.12, "money", at + offsets[3] + 0.08, 0.75);
          }
        }

        // Each stat card gets a color overlay that fades in after its neon backlight.
        document.querySelectorAll(".stat-card").forEach((card) => {
          const fill = document.createElement("div");
          fill.className = "card-fill";
          card.insertBefore(fill, card.firstChild);
        });

        setScene("sp");

        const tl = gsap.timeline({ paused: true });
        gsap.set(".intro-ui, .scene-ui", { opacity: 0 });
        gsap.set(".intro-ui", { scale: 0.93, transformOrigin: "50% 50%" });
        gsap.set(".intro-kicker, .intro-left h1 span, .intro-left h1 b, .intro-right > *", { opacity: 1, y: 0 });
        gsap.set(".scene-tag, .name-card, .stat-card, .chart-card, .event-list", { opacity: 0, y: 32 });
        gsap.set(".tile", { transformOrigin: "50% 50%" });
        gsap.set(".tile-board", { scale: 1, x: 0, y: 0 });

        function enterSceneCards(at, offsets, key) {
          const schedule = offsets || [0.2, 0.55, 0.9, 1.25];
          const scene = scenes[key];
          const isEvents = scene.events.length > 0;
          const accent = scene.accent;
          const baseShadow = "inset 0 1px 0 rgba(255,255,255,.85), 0 22px 48px -28px rgba(30,45,70,.3)";

          // Header
          tl.fromTo(".scene-tag", { opacity: 0, y: 24, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.42, ease: "power3.out" }, at);
          if (scene.name) {
            tl.fromTo(".name-card", { opacity: 0, y: 28, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.46, ease: "power3.out" }, at + 0.1);
          }

          // Compose the full grid immediately — frames + labels land in a quick cascade.
          // Cards whose number is spoken later sit dormant (dimmed) until their cue.
          [0, 1, 2, 3].forEach((i) => {
            const dormant = schedule[i] > 0.8;
            tl.fromTo(
              `.card-${i + 1}`,
              { opacity: 0, y: 30, scale: 0.97, filter: "blur(8px)" },
              { opacity: dormant ? 0.5 : 1, y: 0, scale: dormant ? 0.99 : 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out" },
              at + 0.12 + i * 0.07,
            );
          });
          tl.fromTo(
            isEvents ? ".event-list" : ".chart-card",
            { opacity: 0, y: 26, scale: 0.985, filter: "blur(8px)" },
            { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out" },
            at + 0.46,
          );

          // Values/rows stay hidden until their spoken phrase; card colors reset to neutral.
          tl.set(".stat-card .value, .stat-card .sub, .stat-card .note", { opacity: 0, y: 12 }, at + 0.05);
          tl.set(".card-fill", { opacity: 0 }, at + 0.05);
          if (isEvents) tl.set(".event-row", { opacity: 0, y: 16 }, at + 0.05);

          // Chart line actually draws across the scene.
          // Reset to undrawn/hidden at scene start (before the card appears) so the freshly
          // swapped path never flashes fully-drawn, then animate the draw once.
          if (!isEvents) {
            tl.set(".chart-area", { opacity: 0 }, at + 0.05);
            tl.set(".chart-line", { strokeDasharray: 1300, strokeDashoffset: 1300 }, at + 0.05);
            tl.fromTo(".chart-area", { opacity: 0 }, { opacity: 1, duration: 1.3, ease: "power2.out", immediateRender: false }, at + 0.75);
            tl.fromTo(".chart-line", { strokeDasharray: 1300, strokeDashoffset: 1300 }, { strokeDashoffset: 0, duration: 6.6, ease: "power1.inOut", immediateRender: false }, at + 0.75);
          }

          // Energize each card's data on cue: light up, slide value in, count, accent-glow pulse.
          schedule.forEach((off, i) => {
            const cAt = at + off;
            const sel = `.card-${i + 1}`;
            tl.to(sel, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, cAt);
            tl.to(`${sel} .value, ${sel} .sub, ${sel} .note`, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, cAt);
            tl.to(sel, { scale: 1.015, duration: 0.18, ease: "power2.out" }, cAt);
            tl.to(sel, { scale: 1, duration: 0.52, ease: "power2.inOut" }, cAt + 0.18);
            if (i !== scene.active) {
              const card = document.querySelector(sel);
              const glow = { v: 0 };
              const writeGlow = () => { card.style.boxShadow = `${baseShadow}, 0 0 ${46 * glow.v}px -6px ${accent}`; };
              tl.to(glow, { v: 1, duration: 0.26, ease: "power2.out", onUpdate: writeGlow }, cAt);
              tl.to(glow, { v: 0, duration: 0.75, ease: "power2.in", onUpdate: writeGlow }, cAt + 0.3);
              // The neon backlight resolves into a persistent accent color that stays.
              tl.to(`${sel} .card-fill`, { opacity: 1, duration: 0.8, ease: "power2.out" }, cAt + 0.28);
            }
          });

          // "This Week" event rows arrive on their cues.
          if (isEvents) {
            schedule.forEach((off, i) => {
              tl.to(`.event-row.row-${i + 1}`, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, at + off);
            });
          }

          countSceneNumbers(key, at, schedule);
        }

        tl.from(".tile", {
          opacity: 0,
          scale: 0.94,
          z: (i) => [-70, -20, 38, -34, 18, -44, 52, 88, 36, -52, 22, -30, 44, 70, -26][i],
          x: (i) => [-32, 18, -12, 28, 44, -48, -18, 0, 18, 52, -44, -24, 8, 30, 46][i],
          y: (i) => [-26, -42, -30, -36, -22, 8, 14, 0, 10, 18, 38, 32, 28, 36, 42][i],
          stagger: 0.035,
          duration: 0.75,
          ease: "power3.out",
        }, 0);

        tl.to(".tile:not(.avatar-tile)", {
          x: (i, el) => (el.classList.contains("c1") || el.classList.contains("c2") ? -140 : el.classList.contains("c4") || el.classList.contains("c5") ? 140 : 0),
          y: (i, el) => (el.classList.contains("r1") ? -80 : el.classList.contains("r3") ? 80 : 0),
          z: -90,
          opacity: 0.42,
          duration: 2.15,
          ease: "power2.inOut",
        }, 1.05);
        tl.to(".tile-board", { scale: 5.08, x: -26, y: -6, duration: 2.35, ease: "power3.inOut" }, 1.25);
        tl.to(".scene-video", { left: 620, top: 60, width: 690, height: 980, borderRadius: 30, duration: 2.1, ease: "power3.inOut" }, 1.35);
        tl.to(".intro-ui", { opacity: 1, scale: 1, duration: 0.72, ease: "power2.out" }, 1.35);
        tl.fromTo(".intro-rule", { scaleX: 0, transformOrigin: "100% 50%" }, { scaleX: 1, duration: 0.44, ease: "power2.out" }, 1.58);
        tl.to(".intro-bg", { opacity: 1, duration: 0.55, ease: "power2.out" }, 2.82);
        tl.to(".parallax-scene", { opacity: 0, duration: 0.55, ease: "power2.out" }, 3.18);

        tl.to(".intro-ui", { opacity: 0, duration: 0.28 }, 4.05);
        tl.call(() => setScene("sp"), [], 4.08);
        tl.to(".scene-ui", { opacity: 1, duration: 0.18 }, 4.12);
        tl.to(".scene-video", { left: 112, top: 30, width: 542, height: 964, borderRadius: 16, duration: 0.56, ease: "power3.inOut" }, 4.12);
        enterSceneCards(4.72, [0.05, 5.85, 13.15, 19.35], "sp");

        tl.to(".stat-card, .chart-card, .event-list, .scene-tag, .name-card", { opacity: 0, y: -16, filter: "blur(6px)", duration: 0.2, ease: "power2.in" },27.9);
        tl.call(() => setScene("nd"), [], 28.12);
        tl.to(".scene-video", { left: 112, top: 30, width: 542, height: 964, borderRadius: 16, duration: 0.28 }, 28.12);
        enterSceneCards(28.23, [0.05, 5.6, 1.1, 2.6], "nd");

        tl.to(".stat-card, .chart-card, .event-list, .scene-tag, .name-card", { opacity: 0, y: -16, filter: "blur(6px)", duration: 0.2, ease: "power2.in" },38.78);
        tl.call(() => setScene("ra"), [], 39.04);
        tl.to(".scene-video", { left: 112, top: 30, width: 542, height: 964, borderRadius: 16, duration: 0.28 }, 39.04);
        enterSceneCards(39.15, [2.15, 9.3, 18.25, 14.35], "ra");

        tl.to(".stat-card, .chart-card, .event-list, .scene-tag, .name-card", { opacity: 0, y: -16, filter: "blur(6px)", duration: 0.2, ease: "power2.in" },62.24);
        tl.call(() => setScene("wk"), [], 62.5);
        tl.to(".scene-video", { left: 112, top: 30, width: 542, height: 964, borderRadius: 16, duration: 0.28 }, 62.5);
        enterSceneCards(62.62, [2.1, 5.2, 6.3, 8.7], "wk");

        // No end fade — the A-roll and final scene stay on screen through the end of the script.

        // Drive the shader background deterministically from the playhead for all 80s.
        if (shaderState) {
          tl.to({}, { duration: 80, ease: "none", onUpdate: () => shaderState.renderAt(tl.time()) }, 0);
        }

        window.__timelines["may-financial-recap-cathedral-light"] = tl;
      </script>
    </div>
  </body>
</html>
