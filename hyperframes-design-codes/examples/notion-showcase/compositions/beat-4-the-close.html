    <style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var comp = document.querySelector('[data-composition-id="beat-4-the-close"]');

      // Seeded PRNG (mulberry32)
      function mulberry32(a) {
        return function() {
          a |= 0; a = a + 0x6D2B79F5 | 0;
          var t = Math.imul(a ^ a >>> 15, 1 | a);
          t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }
      var rand = mulberry32(42);

      // Draw particles on canvas
      var canvas = comp.querySelector('#particles');
      var ctx = canvas.getContext('2d');
      var particles = [];
      for (var i = 0; i < 80; i++) {
        particles.push({
          x: rand() * 1920,
          y: rand() * 1080,
          size: rand() * 2 + 0.5,
          speed: rand() * 0.3 + 0.1,
          alpha: rand() * 0.3 + 0.1
        });
      }

      var proxy = { t: 0 };
      function drawParticles() {
        ctx.clearRect(0, 0, 1920, 1080);
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          var py = p.y - proxy.t * p.speed * 60;
          py = ((py % 1080) + 1080) % 1080;
          ctx.beginPath();
          ctx.arc(p.x, py, p.size, 0, 6.283);
          ctx.fillStyle = 'rgba(255, 255, 255, ' + p.alpha + ')';
          ctx.fill();
        }
      }
      drawParticles();

      // Animate particles upward
      tl.to(proxy, {
        t: 5,
        duration: 5,
        ease: 'none',
        onUpdate: drawParticles
      }, 0);

      // Logo stroke draws in
      tl.to('.logo-stroke', {
        strokeDashoffset: 0,
        duration: 1.0,
        ease: 'power2.inOut'
      }, 0.2);

      // Logo fill floods in after stroke
      tl.to('.logo-fill-path', {
        opacity: 1,
        duration: 0.3,
        ease: 'power2.out'
      }, 1.3);

      // Logo stroke fades out as fill takes over
      tl.to('.logo-stroke', {
        opacity: 0,
        duration: 0.3,
        ease: 'power1.out'
      }, 1.4);

      // "Your AI workspace" fades in
      tl.fromTo('.tag-line-1', {
        opacity: 0, y: 16
      }, {
        opacity: 1, y: 0, duration: 0.5, ease: 'power2.out'
      }, 1.8);

      // "with built-in agents." slides in
      tl.fromTo('.tag-line-2', {
        opacity: 0, y: 16
      }, {
        opacity: 1, y: 0, duration: 0.5, ease: 'power2.out'
      }, 2.3);

      // Bg glow pulses gently
      tl.to('.bg-glow', {
        scale: 1.1,
        opacity: 0.8,
        duration: 2,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 1
      }, 0.5);

      // Hold and fade to silence — no exit transition (final beat)
      window.__timelines["beat-4-the-close"] = tl;
    </script>
