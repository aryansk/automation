<template id="beat-2-template">
  <div data-composition-id="beat-2-the-agents" data-width="1920" data-height="1080" data-start="0" data-duration="5.5">
    <!-- Background: white with subtle grid -->
    <div class="bg-grid"></div>

    <!-- Three agent cards -->
    <div class="cards-container">
      <div class="agent-card card-qa">
        <div class="card-accent accent-blue"></div>
        <div class="card-content">
          <svg class="card-icon" viewBox="0 0 48 48" fill="none">
            <path class="icon-path icon-path-qa" d="M8 12 C8 8 12 6 24 6 C36 6 40 8 40 12 L40 30 C40 34 36 36 28 36 L20 42 L20 36 C12 36 8 34 8 30 Z" stroke="#0075DE" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </svg>
          <span class="card-title">Q&A</span>
          <span class="card-subtitle">Answers instantly</span>
        </div>
      </div>

      <div class="agent-card card-routing">
        <div class="card-accent accent-orange"></div>
        <div class="card-content">
          <svg class="card-icon" viewBox="0 0 48 48" fill="none">
            <path class="icon-path icon-path-routing" d="M6 24 L18 24 L24 12 L30 36 L36 24 L42 24" stroke="#FF6D00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="card-title">Task Routing</span>
          <span class="card-subtitle">Assigns &amp; prioritizes</span>
        </div>
      </div>

      <div class="agent-card card-reports">
        <div class="card-accent accent-teal"></div>
        <div class="card-content">
          <svg class="card-icon" viewBox="0 0 48 48" fill="none">
            <path class="icon-path icon-path-reports" d="M12 6 L36 6 L36 42 L12 42 Z M18 14 L30 14 M18 22 L30 22 M18 30 L26 30" stroke="#27918D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </svg>
          <span class="card-title">Reports</span>
          <span class="card-subtitle">Writes &amp; sends</span>
        </div>
      </div>
    </div>

    <!-- 24/7 big type -->
    <div class="big-247-wrap">
      <span class="big-247">24/7</span>
    </div>

    <!-- Floating accent dots -->
    <div class="dot dot-blue"></div>
    <div class="dot dot-orange"></div>
    <div class="dot dot-teal"></div>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=block');

      [data-composition-id="beat-2-the-agents"] {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        position: relative;
        background: #FFFFFF;
        font-family: 'Inter', sans-serif;
      }

      .bg-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
        background-size: 80px 80px;
      }

      .cards-container {
        position: absolute;
        top: 140px;
        left: 160px;
        display: flex;
        flex-direction: column;
        gap: 40px;
        z-index: 2;
      }

      .agent-card {
        display: flex;
        flex-direction: row;
        align-items: stretch;
        width: 680px;
        height: 200px;
        border-radius: 16px;
        border: 1px solid #00000014;
        background: #FFFFFF;
        overflow: hidden;
        opacity: 0;
      }

      .card-accent {
        width: 6px;
        flex-shrink: 0;
      }

      .accent-blue { background: #0075DE; }
      .accent-orange { background: #FF6D00; }
      .accent-teal { background: #27918D; }

      .card-content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 28px 40px;
        gap: 8px;
      }

      .card-icon {
        width: 48px;
        height: 48px;
        margin-bottom: 4px;
      }

      .icon-path {
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
      }

      .card-title {
        font-size: 64px;
        font-weight: 800;
        color: #040404;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      .card-subtitle {
        font-size: 24px;
        font-weight: 400;
        color: #78736F;
        letter-spacing: 0;
      }

      .big-247-wrap {
        position: absolute;
        right: 200px;
        top: 50%;
        margin-top: -100px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 3;
      }

      .big-247 {
        font-size: 200px;
        font-weight: 800;
        color: #040404;
        letter-spacing: -0.04em;
        line-height: 1;
        opacity: 0;
      }

      .dot {
        position: absolute;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        opacity: 0;
        z-index: 4;
      }

      .dot-blue { background: #0075DE; top: 120px; right: 300px; }
      .dot-orange { background: #FF6D00; top: 400px; right: 180px; }
      .dot-teal { background: #27918D; bottom: 200px; right: 350px; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var comp = document.querySelector('[data-composition-id="beat-2-the-agents"]');

      // Card 1 (Q&A) SLIDES in from right
      tl.fromTo('.card-qa', {
        opacity: 0, x: 200
      }, {
        opacity: 1, x: 0, duration: 0.5, ease: 'power3.out'
      }, 0.2);

      // SVG icon draws in
      tl.to('.icon-path-qa', {
        strokeDashoffset: 0, duration: 0.6, ease: 'power2.out'
      }, 0.3);

      // Card 2 (Task Routing) SLIDES in
      tl.fromTo('.card-routing', {
        opacity: 0, x: 200
      }, {
        opacity: 1, x: 0, duration: 0.5, ease: 'power3.out'
      }, 0.6);

      tl.to('.icon-path-routing', {
        strokeDashoffset: 0, duration: 0.6, ease: 'power2.out'
      }, 0.7);

      // Card 3 (Reports) SLIDES in
      tl.fromTo('.card-reports', {
        opacity: 0, x: 200
      }, {
        opacity: 1, x: 0, duration: 0.5, ease: 'power3.out'
      }, 1.0);

      tl.to('.icon-path-reports', {
        strokeDashoffset: 0, duration: 0.6, ease: 'power2.out'
      }, 1.1);

      // Floating dots fade in with subtle drift
      tl.to('.dot-blue', { opacity: 0.6, duration: 0.4, ease: 'power1.out' }, 0.5);
      tl.to('.dot-orange', { opacity: 0.6, duration: 0.4, ease: 'power1.out' }, 0.9);
      tl.to('.dot-teal', { opacity: 0.6, duration: 0.4, ease: 'power1.out' }, 1.3);

      // Dots float gently
      tl.to('.dot-blue', { y: -20, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0.5);
      tl.to('.dot-orange', { y: 15, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0.9);
      tl.to('.dot-teal', { y: -12, duration: 2.8, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.3);

      // Cards subtle float during hold
      tl.to('.card-qa', { y: -6, duration: 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.5);
      tl.to('.card-routing', { y: 4, duration: 2.2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.7);
      tl.to('.card-reports', { y: -5, duration: 1.8, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.9);

      // "24/7" SLAMS in on the VO cue (~4.3s into beat)
      tl.fromTo('.big-247', {
        opacity: 0, scale: 1.4
      }, {
        opacity: 1, scale: 1, duration: 0.2, ease: 'power4.out'
      }, 4.3);

      // All cards pulse on 24/7 appearance
      tl.to('.agent-card', {
        scale: 1.02,
        duration: 0.15,
        ease: 'power2.out',
        yoyo: true,
        repeat: 1
      }, 4.4);

      // Exit: velocity-matched upward
      tl.to(comp.children, {
        y: -120,
        filter: 'blur(24px)',
        opacity: 0,
        duration: 0.3,
        ease: 'power2.in',
        stagger: 0.02
      }, 5.2);

      window.__timelines["beat-2-the-agents"] = tl;
    </script>
  </div>
</template>
