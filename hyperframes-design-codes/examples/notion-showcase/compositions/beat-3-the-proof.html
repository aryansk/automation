        <img src="../assets/svgs/logo-14.svg" class="partner-logo" crossorigin="anonymous" />
        <img src="../assets/svgs/logo-15.svg" class="partner-logo" crossorigin="anonymous" />
        <img src="../assets/svgs/logo-16.svg" class="partner-logo" crossorigin="anonymous" />
        <img src="../assets/svgs/logo-17.svg" class="partner-logo" crossorigin="anonymous" />
        <img src="../assets/svgs/logo-18.svg" class="partner-logo" crossorigin="anonymous" />
        <img src="../assets/svgs/logo-19.svg" class="partner-logo" crossorigin="anonymous" />
        <img src="../assets/svgs/logo-20.svg" class="partner-logo" crossorigin="anonymous" />
        <img src="../assets/svgs/logo-21.svg" class="partner-logo" crossorigin="anonymous" />
        <img src="../assets/svgs/logo-22.svg" class="partner-logo" crossorigin="anonymous" />
        <img src="../assets/svgs/logo-23.svg" class="partner-logo" crossorigin="anonymous" />
        <img src="../assets/svgs/logo-24.svg" class="partner-logo" crossorigin="anonymous" />
      </div>
    </div>

    <!-- Accent line -->
    <div class="accent-line"></div>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=block');

      [data-composition-id="beat-3-the-proof"] {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        position: relative;
        background: #FFFFFF;
        font-family: 'Inter', sans-serif;
      }

      .bg-warm {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #FFFFFF 0%, #F6F5F4 100%);
      }

      .product-card-wrap {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
      }

      .product-card {
        width: 1100px;
        height: 750px;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid #00000014;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.08);
        opacity: 0;
      }

      .product-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .stat-wrap {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 840px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 3;
      }

      .stat-number {
        font-size: 220px;
        font-weight: 800;
        color: #02093A;
        letter-spacing: -0.04em;
        line-height: 1;
        opacity: 0;
      }

      .stat-label {
        font-size: 48px;
        font-weight: 400;
        color: #78736F;
        margin-top: 16px;
        opacity: 0;
      }

      .marquee-strip {
        position: absolute;
        bottom: 80px;
        left: 0;
        width: 100%;
        height: 80px;
        overflow: hidden;
        z-index: 4;
        opacity: 0;
        padding: 0 120px;
        box-sizing: border-box;
      }

      .marquee-track {
        display: flex;
        align-items: center;
        gap: 56px;
        height: 100%;
        width: max-content;
      }

      .partner-logo {
        height: 44px;
        width: auto;
        opacity: 0.92;
        filter: none;
      }

      .accent-line {
        position: absolute;
        bottom: 170px;
        left: 50%;
        width: 0;
        height: 2px;
        background: #0075DE;
        z-index: 5;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var comp = document.querySelector('[data-composition-id="beat-3-the-proof"]');

      // Product card RISES from bottom
      tl.fromTo('.product-card', {
        opacity: 0, y: 300, rotation: -2
      }, {
        opacity: 1, y: 0, rotation: 0, duration: 0.7, ease: 'power3.out'
      }, 0.2);

      // Product card subtle float
      tl.to('.product-card', {
        y: -8,
        duration: 2,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 1
      }, 1.0);

      // Product card scales down and fades
      tl.to('.product-card', {
        scale: 0.7,
        opacity: 0,
        duration: 0.4,
        ease: 'power2.in'
      }, 3.5);

      // "62%" CRASHES in
      tl.fromTo('.stat-number', {
        opacity: 0, scale: 2
      }, {
        opacity: 1, scale: 1, duration: 0.2, ease: 'power4.out'
      }, 4.0);

      // "of Fortune 100" fades in
      tl.fromTo('.stat-label', {
        opacity: 0, y: 20
      }, {
        opacity: 1, y: 0, duration: 0.4, ease: 'power2.out'
      }, 4.2);

      // Accent line draws
      tl.to('.accent-line', {
        width: 200,
        marginLeft: -100,
        duration: 0.5,
        ease: 'power2.out'
      }, 4.4);

      // Logo marquee fades in
      tl.to('.marquee-strip', {
        opacity: 1,
        duration: 0.5,
        ease: 'power1.out'
      }, 4.5);

      // Logo marquee continuous scroll
      tl.to('.marquee-track', {
        x: -960,
        duration: 8,
        ease: 'none'
      }, 4.5);

      // Stat number subtle pulse
      tl.to('.stat-number', {
        scale: 1.02,
        duration: 1,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: 1
      }, 4.5);

      // Exit: whip pan left
      tl.to(comp.children, {
        x: -400,
        filter: 'blur(20px)',
        opacity: 0.4,
        duration: 0.3,
        ease: 'power3.in'
      }, 6.7);


      window.__timelines["beat-3-the-proof"] = tl;
    </script>
  </div>
</template>
