<template id="beat-1-hook-template">
  <div data-composition-id="beat-1-hook" data-width="1920" data-height="1080" data-start="0" data-duration="3.5">

    <!-- BG: Coral streaks background image -->
    <div class="bg-streaks">
      <img src="../assets/bg-27ef38d6.png" alt="" />
    </div>

    <!-- MG: Ghost keyboard glyphs -->
    <div class="ghost-keys">
      <span class="ghost-key gk-1">&#x2318;</span>
      <span class="ghost-key gk-2">&#x2325;</span>
      <span class="ghost-key gk-3">&#x21E7;</span>
      <span class="ghost-key gk-4">&#x2318;</span>
      <span class="ghost-key gk-5">&#x2325;</span>
      <span class="ghost-key gk-6">&#x21E7;</span>
      <span class="ghost-key gk-7">&#x2318;</span>
    </div>

    <!-- FG: Logo + Tagline -->
    <div class="fg-content">
      <div class="logo-wrap">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#FF6363" fill-rule="evenodd" d="M12 30.99V36L-.01 23.99l2.516-2.499zM17.01 36H12l12.011 12.01 2.506-2.505zm28.487-9.497L48 24 24 0l-2.503 2.503L30.98 12h-5.732l-6.62-6.614-2.506 2.503 4.122 4.122h-2.869v18.625H36V27.77l4.122 4.122 2.503-2.506L36 22.747v-5.732zM13.253 10.747l-2.503 2.506 2.686 2.686 2.503-2.506zm21.314 21.314-2.495 2.503 2.686 2.686 2.506-2.503zM7.878 16.121l-2.503 2.504L12 25.253v-5.012zM27.756 36h-5.009l6.628 6.625 2.503-2.503z" clip-rule="evenodd"/>
        </svg>
      </div>
      <div class="tagline"></div>
    </div>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=block');

      [data-composition-id="beat-1-hook"] {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        position: relative;
        background: #07080A;
        font-family: 'Inter', sans-serif;
      }

      [data-composition-id="beat-1-hook"] .bg-streaks {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      [data-composition-id="beat-1-hook"] .bg-streaks img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      [data-composition-id="beat-1-hook"] .ghost-keys {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      [data-composition-id="beat-1-hook"] .ghost-key {
        position: absolute;
        font-family: 'Inter', sans-serif;
        font-size: 120px;
        font-weight: 700;
        color: #FFFFFF;
        opacity: 0.04;
        user-select: none;
      }

      [data-composition-id="beat-1-hook"] .ghost-key.gk-1 { left: 8%; top: 15%; font-size: 140px; }
      [data-composition-id="beat-1-hook"] .ghost-key.gk-2 { left: 72%; top: 55%; font-size: 100px; }
      [data-composition-id="beat-1-hook"] .ghost-key.gk-3 { left: 25%; top: 70%; font-size: 160px; }
      [data-composition-id="beat-1-hook"] .ghost-key.gk-4 { left: 85%; top: 10%; font-size: 110px; }
      [data-composition-id="beat-1-hook"] .ghost-key.gk-5 { left: 50%; top: 40%; font-size: 130px; }
      [data-composition-id="beat-1-hook"] .ghost-key.gk-6 { left: 15%; top: 45%; font-size: 90px; }
      [data-composition-id="beat-1-hook"] .ghost-key.gk-7 { left: 62%; top: 80%; font-size: 150px; }

      [data-composition-id="beat-1-hook"] .fg-content {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
      }

      [data-composition-id="beat-1-hook"] .logo-wrap {
        width: 200px;
        height: auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      [data-composition-id="beat-1-hook"] .logo-wrap svg {
        width: 200px;
        height: 200px;
      }

      [data-composition-id="beat-1-hook"] .tagline {
        font-size: 56px;
        font-weight: 700;
        color: #FFFFFF;
        letter-spacing: -0.02em;
        line-height: 1.1;
        white-space: nowrap;
      }

      [data-composition-id="beat-1-hook"] .tagline .char {
        display: inline-block;
        opacity: 0;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
    (function () {
      var taglineText = "Your shortcut to everything.";
      var taglineEl = document.querySelector('[data-composition-id="beat-1-hook"] .tagline');
      for (var i = 0; i < taglineText.length; i++) {
        var span = document.createElement('span');
        span.className = 'char';
        span.textContent = taglineText[i] === ' ' ? '\u00A0' : taglineText[i];
        taglineEl.appendChild(span);
      }

      var bgStreaks = document.querySelector('[data-composition-id="beat-1-hook"] .bg-streaks');
      var bgImg = document.querySelector('[data-composition-id="beat-1-hook"] .bg-streaks img');
      var logoWrap = document.querySelector('[data-composition-id="beat-1-hook"] .logo-wrap');
      var chars = document.querySelectorAll('[data-composition-id="beat-1-hook"] .tagline .char');
      var ghostKeys = document.querySelectorAll('[data-composition-id="beat-1-hook"] .ghost-key');

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      gsap.set(bgStreaks, { clipPath: "polygon(100% 100%, 100% 100%, 100% 100%, 100% 100%)" });
      gsap.set(logoWrap, { scale: 1.4, opacity: 0 });
      gsap.set(chars, { opacity: 0 });

      tl.to(bgStreaks, {
        clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
        duration: 0.3,
        ease: "power3.out"
      }, 0.05);

      tl.fromTo(bgImg, { scale: 1.0 }, {
        scale: 1.02,
        duration: 3.5,
        ease: "none"
      }, 0);

      tl.to(logoWrap, {
        scale: 1,
        opacity: 1,
        duration: 0.3,
        ease: "back.out(1.7)"
      }, 0.15);

      tl.to(chars, {
        opacity: 1,
        duration: 0.15,
        stagger: 0.03,
        ease: "power1.out"
      }, 0.45);

      tl.fromTo(ghostKeys, { y: 0 }, {
        y: -40,
        duration: 3.5,
        ease: "none"
      }, 0);

      window.__timelines["beat-1-hook"] = tl;
    })();
    </script>
  </div>
</template>
