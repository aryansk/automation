    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ── 0.00s: Launcher entrance ── */

        { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 0);

      /* ── 0.00s: "Search" label fades in ── */

        { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, 0.3);

      /* Search cursor blink */

      /* ── 1.50s: State 1 exits left, State 2 enters from right ── */
      /* Exit state 1 */
      tl.to("#b2f-state-search", { x: -60, opacity: 0, duration: 0.15, ease: "power2.in" }, 1.50);
      /* Label swap: Search out, Launch in */
      tl.to("#b2f-label-search", { opacity: 0, duration: 0.1, ease: "power1.in" }, 1.50);
      tl.fromTo("#b2f-label-launch",
        { opacity: 0, y: 6 },
        { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, 1.55);
      /* Enter state 2 */
      tl.fromTo("#b2f-state-launch",
        { x: 60, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.15, ease: "power2.out" }, 1.55);

      /* ── 2.80s: State 2 exits left, State 3 enters from right ── */
      tl.to("#b2f-state-launch", { x: -60, opacity: 0, duration: 0.15, ease: "power2.in" }, 2.80);
      tl.to("#b2f-label-launch", { opacity: 0, duration: 0.1, ease: "power1.in" }, 2.80);
      tl.fromTo("#b2f-label-control",
        { opacity: 0, y: 6 },
        { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, 2.85);
      tl.fromTo("#b2f-state-control",
        { x: 60, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.15, ease: "power2.out" }, 2.85);

      /* ── 0.00–5.00s: Floating icons orbit (yoyo sin/cos approximation) ── */
      /* Each orb does a small 10px-radius orbit via x/y yoyo tweens at different speeds */
      tl.to("#b2f-orb-1", { x: 10, y: -7, duration: 1.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.to("#b2f-orb-2", { x: -8, y: 10, duration: 2.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.to("#b2f-orb-3", { x: 7, y: 9, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.to("#b2f-orb-4", { x: -10, y: -6, duration: 2.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.to("#b2f-orb-5", { x: 9, y: 8, duration: 1.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.to("#b2f-orb-6", { x: -7, y: -10, duration: 2.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      /* ── 4.50s: Exit — scale down, blur, fade ── */
      tl.to("#b2f-exit-wrap", {
        scale: 0.85,
        filter: "blur(6px)",
        opacity: 0,
        duration: 0.25,
        ease: "power2.in"

      /* Also fade out the floating orbs */
      tl.to("#b2f-orb-1, #b2f-orb-2, #b2f-orb-3, #b2f-orb-4, #b2f-orb-5, #b2f-orb-6", {
        opacity: 0,
        duration: 0.2,
        ease: "power1.in"
      }, 4.50);

      window.__timelines["beat-2-features"] = tl;
