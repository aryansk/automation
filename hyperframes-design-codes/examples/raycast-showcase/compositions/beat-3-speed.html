<template id="beat-3-speed-template">
  <div data-composition-id="beat-3-speed" data-width="1920" data-height="1080" data-start="0" data-duration="3.5">

    <!-- BG layer -->
    <div class="bg-layer"></div>

    <!-- MG layer: SVG horizontal line -->
    <div class="mg-layer">
      <svg viewBox="0 0 1152 2" xmlns="http://www.w3.org/2000/svg">
        <line class="speed-line" x1="0" y1="1" x2="1152" y2="1"
              stroke-dasharray="1152"
              stroke-dashoffset="1152" />
      </svg>
    </div>

    <!-- FG layer: typography stack -->
    <div class="fg-layer">
      <div class="headline-fast">Fast.</div>
      <div class="counter">000</div>
      <div class="stat-line">99.8% crash-free rate</div>
    </div>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Geist+Mono&display=block');

      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      [data-composition-id="beat-3-speed"] {
        width: 1920px;
        height: 1080px;
        position: relative;
        overflow: hidden;
        background: #07080A;
        font-family: 'Inter', sans-serif;
      }

      [data-composition-id="beat-3-speed"] .bg-layer {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: #07080A;
      }

      [data-composition-id="beat-3-speed"] .mg-layer {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      [data-composition-id="beat-3-speed"] .mg-layer svg {
        width: 1152px;
        height: 2px;
      }

      [data-composition-id="beat-3-speed"] .mg-layer line {
        stroke: rgba(255, 255, 255, 0.15);
        stroke-width: 1;
      }

      [data-composition-id="beat-3-speed"] .fg-layer {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
      }

      [data-composition-id="beat-3-speed"] .headline-fast {
        font-family: 'Inter', sans-serif;
        font-weight: 900;
        font-size: 160px;
        color: #FFFFFF;
        line-height: 1;
        opacity: 0;
      }

      [data-composition-id="beat-3-speed"] .counter {
        font-family: 'Geist Mono', monospace;
        font-size: 48px;
        color: #FF6363;
        line-height: 1;
        margin-top: 32px;
        opacity: 0;
      }

      [data-composition-id="beat-3-speed"] .stat-line {
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        font-size: 24px;
        color: #9C9C9D;
        line-height: 1;
        margin-top: 24px;
        opacity: 0;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var root = document.querySelector('[data-composition-id="beat-3-speed"]');
      var headline = root.querySelector('.headline-fast');
      var counter = root.querySelector('.counter');
      var statLine = root.querySelector('.stat-line');
      var speedLine = root.querySelector('.speed-line');

      var tl = gsap.timeline({ paused: true });

      tl.fromTo(headline,
        { scale: 2.0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.15, ease: "power4.out" },
        0
      );

      tl.to(headline,
        { y: -80, opacity: 0, duration: 0.15, ease: "power2.in" },
        0.50
      );

      tl.set(counter, { opacity: 1 }, 0.70);

      var proxy = { val: 0 };
      tl.to(proxy, {
        val: 4,
        duration: 0.8,
        ease: "steps(4)",
        onUpdate: function () {
          var v = Math.round(proxy.val);
          counter.textContent = String(v).padStart(3, '0');
        }
      }, 0.70);

      tl.to(speedLine, {
        attr: { 'stroke-dashoffset': 0 },
        duration: 1.0,
        ease: "power2.inOut"
      }, 0.70);

      tl.fromTo(statLine,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
        1.20
      );

      tl.to(root.querySelector('.fg-layer'), {
        scale: 1.15,
        opacity: 0,
        filter: "blur(16px)",
        duration: 0.25,
        ease: "power3.in"
      }, 3.00);

      tl.to(root.querySelector('.mg-layer'), {
        scale: 1.15,
        opacity: 0,
        filter: "blur(16px)",
        duration: 0.25,
        ease: "power3.in"
      }, 3.00);

      window.__timelines["beat-3-speed"] = tl;
    })();
    </script>
  </div>
</template>
