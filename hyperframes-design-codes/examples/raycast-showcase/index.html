<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920" />
  <title>Raycast — Your Shortcut to Everything (15s Social Ad)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07080A; }
  </style>
</head>
<body data-composition-id="root" data-width="1920" data-height="1080" data-duration="15" data-fps="30">

  <!-- Beat 1: Hook — "Your shortcut to everything." -->
  <div
    id="beat-1"
    data-composition-id="beat-1-hook"
    data-composition-src="compositions/beat-1-hook.html"
    data-start="0"
    data-duration="3.5"
    data-track-index="1"
    data-width="1920"
    data-height="1080"
  ></div>

  <!-- Beat 2: Features — "Search, launch, control..." -->
  <div
    id="beat-2"
    data-composition-id="beat-2-features"
    data-composition-src="compositions/beat-2-features.html"
    data-start="3.5"
    data-duration="5.0"
    data-track-index="1"
    data-width="1920"
    data-height="1080"
  ></div>

  <!-- Beat 3: Speed Proof — "Fast. Think in milliseconds." -->
  <div
    id="beat-3"
    data-composition-id="beat-3-speed"
    data-composition-src="compositions/beat-3-speed.html"
    data-start="8.5"
    data-duration="3.5"
    data-track-index="1"
    data-width="1920"
    data-height="1080"
  ></div>

  <!-- Beat 4: CTA — "Raycast. Download free." -->
  <div
    id="beat-4"
    data-composition-id="beat-4-cta"
    data-composition-src="compositions/beat-4-cta.html"
    data-start="12.0"
    data-duration="3.0"
    data-track-index="1"
    data-width="1920"
    data-height="1080"
  ></div>

  <!-- Narration Audio -->
  <audio
    id="narration"
    src="narration.wav"
    data-start="0.5"
    data-duration="7.0"
    data-track-index="0"
    data-volume="1"
  ></audio>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    window.__timelines["root"] = tl;
  </script>

</body>
</html>
