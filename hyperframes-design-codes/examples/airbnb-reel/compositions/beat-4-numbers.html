    <style>

      [data-composition-id="beat-4-numbers"] {

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const duration = 11.50;
        const root = document.querySelector('[data-composition-id="beat-4-numbers"]');

        // ---------- Initial states (set inside timeline at t=0) ----------
        // Mosaic cards start invisible
        const cards = [
          { sel: ".b4-card-1", bobDelay: 0.0 },
          { sel: ".b4-card-2", bobDelay: 0.6 },
          { sel: ".b4-card-3", bobDelay: 1.2 },
          { sel: ".b4-card-4", bobDelay: 0.3 },
          { sel: ".b4-card-5", bobDelay: 0.9 },
          { sel: ".b4-card-6", bobDelay: 1.5 },
        ];

        cards.forEach((c) => {
          tl.set(c.sel, { opacity: 0 }, 0);
        });

        // Stat 1 starts hidden too (we'll fade in label separately)
        tl.set(".b4-stat-1", { opacity: 0, y: 60 }, 0);
        tl.set(".b4-suffix-1", { scale: 0, opacity: 0, transformOrigin: "left center" }, 0);

        // Stat 2 hidden
        tl.set(".b4-stat-2", { opacity: 0, y: 60 }, 0);

        // Stat 3 hidden
        tl.set(".b4-stat-3", { opacity: 0, y: 60 }, 0);
        tl.set(".b4-heart", { scale: 1 }, 0);
        tl.set(".b4-suffix-3", { scale: 0, opacity: 0, transformOrigin: "left center" }, 0);

        // Label inner-fade initials
        tl.set(".b4-stat-1 .b4-label", { opacity: 0 }, 0);
        tl.set(".b4-stat-2 .b4-label", { opacity: 0 }, 0);
        tl.set(".b4-stat-3 .b4-label", { opacity: 0 }, 0);

        // ---------- Mosaic entrance (stagger) ----------
        cards.forEach((c, i) => {
          tl.to(
            c.sel,
            { opacity: 0.6, duration: 0.6, ease: "power2.out" },
            0 + i * 0.1
          );
        });

        // ---------- Mosaic ambient drift (finite repeats) ----------
        // Bob each card ±6px on Y with sine.inOut. Half-cycle = 2s.
        const cycleDuration = 4;
        // Total bob window ~11s; repeats = ceil(11 / 2) = 6 half-cycles
        cards.forEach((c) => {
          tl.to(
            c.sel,
            {
              y: -6,
              duration: cycleDuration / 2,
              ease: "sine.inOut",
              yoyo: true,
              repeat: 5, // 6 half-cycles * 2s = 12s coverage
            },
            0.6 + c.bobDelay
          );
        });

        // ---------- STAT 1: "7M+" places to stay (narration ~0.2 - 2.0s) ----------
        // Enter at t=0.05
        tl.to(".b4-stat-1", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);

        // Counter 0 -> 7 over 0.8s
        const obj1 = { v: 0 };
        tl.to(
          obj1,
          {
            v: 7,
            duration: 0.8,
            ease: "power2.out",
            onUpdate: () => {
              const el = root.querySelector("#b4-stat-1-num");
              if (el) el.textContent = Math.round(obj1.v);
            },
          },
          0.05
        );

        // Label fade at t=0.4
        tl.to(".b4-stat-1 .b4-label", { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.4);

        // M+ suffix pop at t=0.9
        tl.to(
          ".b4-suffix-1",
          { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2)" },
          0.9
        );

        // Stat 1 exits at t=2.10 (after "stay" lands at ~1.97)
        tl.to(".b4-stat-1", { y: -100, opacity: 0, duration: 0.3, ease: "power3.in" }, 2.10);

        // ---------- STAT 2: 220 countries (narration ~2.2 - 4.4s) ----------
        tl.to(".b4-stat-2", { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.20);

        const obj2 = { v: 0 };
        tl.to(
          obj2,
          {
            v: 220,
            duration: 1.0,
            ease: "power2.out",
            onUpdate: () => {
              const el = root.querySelector("#b4-stat-2-num");
              if (el) el.textContent = Math.round(obj2.v);
            },
          },
          2.20
        );

        tl.to(".b4-stat-2 .b4-label", { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.60);

        // Stat 2 exits at t=4.45 (after "countries" + pause)
        tl.to(".b4-stat-2", { y: -100, opacity: 0, duration: 0.3, ease: "power3.in" }, 4.45);

        // ---------- STAT 3: 2M+ Guest Favourites + heart (narration ~5.2 - 11.1s) ----------
        tl.to(".b4-stat-3", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.85);

        // Heart pulse at t=4.95
        tl.to(".b4-heart", { scale: 1.25, duration: 0.2, ease: "power2.out" }, 4.95);
        tl.to(".b4-heart", { scale: 1.0, duration: 0.2, ease: "back.out(2)" }, 5.15);

        // Counter 0 -> 2 at t=4.90
        const obj3 = { v: 0 };
        tl.to(
          obj3,
          {
            v: 2,
            duration: 0.8,
            ease: "power2.out",
            onUpdate: () => {
              const el = root.querySelector("#b4-stat-3-num");
              if (el) el.textContent = Math.round(obj3.v);
            },
          },
          4.90
        );

        // Label fade at t=5.25
        tl.to(".b4-stat-3 .b4-label", { opacity: 1, duration: 0.4, ease: "power2.out" }, 5.25);

        // Pink M+ suffix pop at t=5.75
        tl.to(
          ".b4-suffix-3",
          { scale: 1.1, opacity: 1, duration: 0.2, ease: "power2.out" },
          5.75
        );
        tl.to(
          ".b4-suffix-3",
          { scale: 1, duration: 0.15, ease: "back.out(2)" },
          5.95
        );

        // No exit on stat 3 — must remain visible at t=11.50

        window.__timelines["beat-4-numbers"] = tl;
      })();
    </script>
  </div>
</template>
