    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="beat-2-triplet"]';

        const shadowOff = '0 6px 16px rgba(0,0,0,0.12)';
        const shadowOn = '0 6px 16px rgba(0,0,0,0.12), 0 0 0 4px #FF385C';

        // 1) Cards cascade in (stagger 0.12s) starting at t=0
        tl.from(scope + ' .b2-card', {
          y: 80,
          opacity: 0,
          duration: 0.5,
          stagger: 0.12,
          ease: 'power2.out',
        }, 0);

        // 2) Labels fade+rise in with stagger 0.14s starting at t=0.5
        tl.from(scope + ' .b2-label', {
          y: 16,
          opacity: 0,
          duration: 0.45,
          stagger: 0.14,
          ease: 'power3.out',
        }, 0.5);

        // 3) Ken Burns on each photo wrapper over full beat (4.33s)
        // Card A: scale 1 -> 1.06 + translateX -12px
        tl.fromTo(scope + ' .b2-photo-A', {
          scale: 1,
          x: 0,
        }, {
          scale: 1.06,
          x: -12,
          duration: 6.90,
          ease: 'none',
        }, 0);

        // Card B: gentle zoom in 1 -> 1.06
        tl.fromTo(scope + ' .b2-photo-B', {
          scale: 1,
        }, {
          scale: 1.06,
          duration: 6.90,
          ease: 'none',
        }, 0);

        // Card C: scale 1 -> 1.06 + translateY -12px (pan up)
        tl.fromTo(scope + ' .b2-photo-C', {
          scale: 1,
          y: 0,
        }, {
          scale: 1.06,
          y: -12,
          duration: 6.90,
          ease: 'none',
        }, 0);

        // 4) Highlight rotation helper
        // Each highlight: pulse the target card's pink ring + heart fill,
        // and dim the other two photos to saturate(0.7) for the hold window.
        function pulseCard(letter, startTime) {
          const all = ['A', 'B', 'C'];
          const others = all.filter((l) => l !== letter);
          const cardSel = scope + ' .b2-card-' + letter;
          const heartPathSel = cardSel + ' .b2-heart svg path';
          const otherPhotos = others.map((l) => scope + ' .b2-photo-' + l);

          // Ring fades in 0.25s
          tl.to(cardSel, {
            boxShadow: shadowOn,
            duration: 0.25,
            ease: 'power2.out',
          }, startTime);

          // Heart fills pink (cross-fade fill to #FF385C, stroke goes transparent-ish to keep clean)
          tl.to(heartPathSel, {
            attr: { fill: '#FF385C', stroke: '#FFFFFF' },
            duration: 0.25,
            ease: 'power2.out',
          }, startTime);

          // Dim other two photos
          otherPhotos.forEach((sel) => {
            tl.to(sel, {
              filter: 'saturate(0.7)',
              duration: 0.25,
              ease: 'power2.out',
            }, startTime);
          });

          // Hold for 0.5s, then release back over 0.3s
          const releaseAt = startTime + 0.25 + 0.5;

          tl.to(cardSel, {
            boxShadow: shadowOff,
            duration: 0.3,
            ease: 'power2.inOut',
          }, releaseAt);

          tl.to(heartPathSel, {
            attr: { fill: 'rgba(0,0,0,0.4)', stroke: '#FFFFFF' },
            duration: 0.3,
            ease: 'power2.inOut',
          }, releaseAt);

          otherPhotos.forEach((sel) => {
            tl.to(sel, {
              filter: 'saturate(1)',
              duration: 0.3,
              ease: 'power2.inOut',
            }, releaseAt);
          });
        }

        // Card A pulses at t=0.35s ("A cabin in the forest")
        pulseCard('A', 0.35);
        // Card B pulses at t=1.77s ("A loft in Rome")
        pulseCard('B', 1.77);
        // Card C pulses at t=4.08s ("A dome under the stars")
        pulseCard('C', 4.08);

        // No exit — cards remain fully visible at t=6.90s.

        window.__timelines["beat-2-triplet"] = tl;
      })();
    </script>
