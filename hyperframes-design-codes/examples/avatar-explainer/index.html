<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Avatar Training Video Overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: #eef3f7;
        font-family: "Noto Sans JP", "Noto Sans", "Hiragino Sans", "Yu Gothic", sans-serif;
      }

      #scene {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle at 52% 10%, rgba(230, 244, 255, 0.8), transparent 26%),
          linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
      }

      .composition-layer {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="scene" data-composition-id="avatar-overlay" data-width="1920" data-height="1080" data-start="0" data-duration="16">
      <div
        id="fullscreen-avatar"
        class="composition-layer"
        data-composition-id="fullscreen-avatar"
        data-composition-src="compositions/fullscreen-avatar.html"
        data-start="0"
        data-duration="8.727"
        data-width="1920"
        data-height="1080"
        data-track-index="1"
        style="z-index: 1"
      ></div>

      <div
        id="diagram-scene"
        class="composition-layer"
        data-composition-id="diagram-scene"
        data-composition-src="compositions/diagram-scene.html"
        data-start="8.62"
        data-duration="7.38"
        data-width="1920"
        data-height="1080"
        data-track-index="2"
        data-layout-allow-overflow
        style="z-index: 2"
      ></div>

      <div
        id="pip-avatar"
        class="composition-layer"
        data-composition-id="pip-avatar"
        data-composition-src="compositions/pip-avatar.html"
        data-start="8.727"
        data-duration="5.273"
        data-width="1920"
        data-height="1080"
        data-track-index="3"
        data-layout-allow-overflow
        style="z-index: 10"
      ></div>

      <div
        id="title-ribbon"
        class="composition-layer"
        data-composition-id="title-ribbon"
        data-composition-src="compositions/title-ribbon.html"
        data-start="0"
        data-duration="16"
        data-width="1920"
        data-height="1080"
        data-track-index="4"
        data-layout-allow-overflow
        style="z-index: 12"
      ></div>

      <div
        id="captions"
        class="composition-layer"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="16"
        data-width="1920"
        data-height="1080"
        data-track-index="5"
        data-layout-allow-overflow
        style="z-index: 14"
      ></div>

      <audio id="avatar-scene12-audio" src="assets/avatar-scene12-bg.mp4" data-start="0" data-duration="8.727" data-track-index="20" data-volume="1"></audio>
      <audio id="avatar-scene3-audio" src="assets/avatar-scene3-bg.mp4" data-start="8.727" data-duration="5.016" data-track-index="21" data-volume="1"></audio>
      <audio id="sfx-opening-ping" src="assets/elevenlabs-soft-ui-ping-v2.mp3" data-start="0.32" data-duration="1" data-track-index="30" data-volume="0.34"></audio>
      <audio id="sfx-subtitle-ping" src="assets/elevenlabs-soft-ui-ping-v2.mp3" data-start="4" data-duration="1" data-track-index="31" data-volume="0.34"></audio>
      <audio id="sfx-diagram-arrow-whoosh" src="assets/elevenlabs-slide-woosh.mp3" data-start="8.62" data-duration="1" data-track-index="32" data-volume="0.19"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["avatar-overlay"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
