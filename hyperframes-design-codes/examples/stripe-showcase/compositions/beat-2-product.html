<template id="beat-2-template">
  <div data-composition-id="beat-2-product" data-width="1920" data-height="1080" data-start="0" data-duration="8.6">

    <!-- L1: Background layers -->
    <div class="scene">
      <div class="bg-base"></div>
      <div class="bg-platform">
        <img src="../assets/platform-graphic-background-2x.png" alt="" />
      </div>
      <div class="bg-connect">
        <img src="../assets/connectbentobackground.jpg" alt="" />
      </div>

      <!-- L5: Gradient sweep (behind content, above bg) -->
      <div class="gradient-sweep"></div>

      <!-- L2: Hero left -->
      <div class="content-left">
        <div class="headline">Financial<br/>infrastructure</div>
        <div class="pills">
          <span class="pill">Payments</span>
          <span class="pill">Billing</span>
          <span class="pill">Subscriptions</span>
          <span class="pill">Fraud detection</span>
        </div>
        <div class="tagline">From your first transaction to your billionth.</div>
      </div>

      <!-- L4: Floating currency symbols -->
      <div class="floaters">
        <span class="floater f1">$</span>
        <span class="floater f2">&euro;</span>
        <span class="floater f3">&pound;</span>
        <span class="floater f4">&yen;</span>
        <span class="floater f5">&#8377;</span>
        <span class="floater f6">&#8361;</span>
      </div>

      <!-- L3: Code card right -->
      <div class="code-card-wrapper">
        <div class="code-card">
          <div class="code-header">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
            <span class="code-title">stripe-api.js</span>
          </div>
          <div class="code-body">
            <div class="code-line cl-1"><span class="kw">const</span> charge = <span class="kw">await</span> stripe.charges.<span class="fn">create</span>({</div>
            <div class="code-line cl-2">  amount: <span class="num">2000</span>,</div>
            <div class="code-line cl-3">  currency: <span class="str">'usd'</span>,</div>
            <div class="code-line cl-4">  source: <span class="str">'tok_visa'</span>,</div>
            <div class="code-line cl-5">  description: <span class="str">'Product launch'</span></div>
            <div class="code-line cl-6">});</div>
            <div class="code-line cl-7">&nbsp;</div>
            <div class="code-line cl-8"><span class="cmt">// Response: 200 OK</span></div>
            <div class="code-line cl-9"><span class="kw">console</span>.<span class="fn">log</span>(charge.<span class="prop">id</span>); <span class="cmt">// ch_3N...</span></div>
          </div>
          <div class="cursor-line"></div>
        </div>
      </div>

      <!-- L6: Wave accent background image -->
      <div class="wave-accent">
        <img src="../assets/payment-bento-background.jpg" alt="" />
      </div>

      <!-- L7: Brand mark -->
      <div class="brand-mark">
        <img src="../assets/svgs/stripe-logo.svg" alt="Stripe" />
      </div>

      <!-- L5: Canvas grain overlay -->
      <canvas class="grain-canvas" width="1920" height="1080"></canvas>
    </div>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Source+Code+Pro:wght@400;500&display=block');

      [data-composition-id="beat-2-product"] {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        position: relative;
        background: #FFFFFF;
        font-family: 'Inter', sans-serif;
      }

      .scene {
        width: 100%;
        height: 100%;
        position: relative;
      }

      /* L1: Background layers */
      .bg-base {
        position: absolute;
        inset: 0;
        background: #FFFFFF;
      }

      .bg-platform {
        position: absolute;
        inset: 0;
        opacity: 0.25;
      }
      .bg-platform img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .bg-connect {
        position: absolute;
        inset: 0;
        opacity: 0.10;
      }
      .bg-connect img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* L5: Gradient sweep */
      .gradient-sweep {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          105deg,
          transparent 0%,
          rgba(83, 58, 253, 0.06) 20%,
          rgba(255, 255, 255, 0.3) 40%,
          rgba(83, 58, 253, 0.04) 60%,
          transparent 80%
        );
        z-index: 1;
        will-change: transform;
      }

      /* L2: Hero content */
      .content-left {
        position: absolute;
        top: 200px;
        left: 80px;
        z-index: 3;
      }

      .headline {
        font-size: 84px;
        font-weight: 300;
        color: #000000;
        letter-spacing: -0.03em;
        line-height: 1.05;
        text-align: left;
      }

      .pills {
        display: flex;
        flex-wrap: nowrap;
        gap: 14px;
        margin-top: 44px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 28px;
        border: 2px solid #533AFD;
        border-radius: 40px;
        color: #533AFD;
        font-size: 22px;
        font-weight: 500;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(4px);
        white-space: nowrap;
        will-change: transform, opacity;
      }

      .tagline {
        margin-top: 44px;
        font-size: 24px;
        font-weight: 300;
        color: #64748D;
        letter-spacing: -0.01em;
        line-height: 1.5;
      }

      /* L4: Floating currency symbols */
      .floaters {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .floater {
        position: absolute;
        font-family: 'Inter', sans-serif;
        font-weight: 300;
        color: #533AFD;
        opacity: 0;
      }
      .f1 { font-size: 48px; left: 60px;  top: 80px; }
      .f2 { font-size: 36px; left: 320px; top: 920px; }
      .f3 { font-size: 42px; left: 900px; top: 60px; }
      .f4 { font-size: 32px; left: 1750px; top: 180px; }
      .f5 { font-size: 38px; left: 1600px; top: 900px; }
      .f6 { font-size: 30px; left: 700px;  top: 980px; }

      /* L3: Code card */
      .code-card-wrapper {
        position: absolute;
        right: 80px;
        top: 160px;
        z-index: 4;
      }

      .code-card {
        width: 680px;
        background: #061B31;
        border-radius: 16px;
        overflow: hidden;
        box-shadow:
          0 4px 6px rgba(6, 27, 49, 0.08),
          0 24px 48px rgba(6, 27, 49, 0.12),
          0 48px 96px rgba(83, 58, 253, 0.08);
        will-change: transform;
      }

      .code-header {
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.05);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .dot-red { background: #FF5F57; }
      .dot-yellow { background: #FFBD2E; }
      .dot-green { background: #28C840; }

      .code-title {
        margin-left: 12px;
        font-family: 'Source Code Pro', monospace;
        font-size: 13px;
        color: rgba(229, 237, 245, 0.5);
        font-weight: 400;
      }

      .code-body {
        padding: 28px 32px 32px;
        font-family: 'Source Code Pro', monospace;
        font-size: 20px;
        line-height: 1.8;
        color: #E5EDF5;
        overflow: hidden;
        position: relative;
      }

      .code-line {
        white-space: pre;
      }

      .cursor-line {
        position: absolute;
        bottom: 28px;
        left: 28px;
        width: 10px;
        height: 22px;
        background: #533AFD;
      }

      .kw { color: #c084fc; }
      .fn { color: #fbbf24; }
      .str { color: #34d399; }
      .num { color: #f97316; }
      .cmt { color: rgba(229, 237, 245, 0.35); font-style: italic; }
      .prop { color: #60a5fa; }

      /* L6: Wave accent */
      .wave-accent {
        position: absolute;
        bottom: -60px;
        right: -40px;
        width: 800px;
        height: 600px;
        opacity: 0;
        z-index: 0;
        border-radius: 40px;
        overflow: hidden;
      }
      .wave-accent img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* L7: Brand mark */
      .brand-mark {
        position: absolute;
        bottom: 60px;
        left: 140px;
        z-index: 5;
        opacity: 0;
      }
      .brand-mark img {
        width: 100px;
        opacity: 0.4;
      }

      /* L5: Grain canvas */
      .grain-canvas {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        opacity: 0.02;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      var S = '[data-composition-id="beat-2-product"] ';
      var tl = gsap.timeline({ paused: true });

      /* --- Grain noise on canvas --- */
      (function() {
        var c = document.querySelector(S + '.grain-canvas');
        if (c) {
          var ctx = c.getContext('2d');
          var w = 1920, h = 1080;
          var imgData = ctx.createImageData(w, h);
          var d = imgData.data;
          /* Simple deterministic noise using a seed */
          var seed = 12345;
          function prng() { seed = (seed * 16807 + 0) % 2147483647; return (seed - 1) / 2147483646; }
          for (var i = 0; i < d.length; i += 4) {
            var v = (prng() * 255) | 0;
            d[i] = v; d[i+1] = v; d[i+2] = v; d[i+3] = 40;
          }
          ctx.putImageData(imgData, 0, 0);
        }
      })();

      /* --- Background parallax --- */
      tl.fromTo(S + '.bg-platform',
        { scale: 1 },
        { scale: 1.08, duration: 8.6, ease: 'sine.inOut' },
        0
      );
      tl.fromTo(S + '.bg-connect',
        { scale: 1.05, x: 20 },
        { scale: 1.12, x: -20, duration: 8.6, ease: 'sine.inOut' },
        0
      );

      /* --- L5: Gradient sweep pan left→right --- */
      tl.fromTo(S + '.gradient-sweep',
        { x: -1920 },
        { x: 1920, duration: 8.6, ease: 'none' },
        0
      );

      /* --- Entry: blur in --- */
      tl.from(S + '.scene',
        { opacity: 0, filter: 'blur(20px)', duration: 0.3, ease: 'power2.out' },
        0
      );

      /* --- L2: Headline from left --- */
      tl.from(S + '.headline',
        { x: -80, opacity: 0, duration: 0.6, ease: 'power3.out' },
        0.3
      );

      /* --- L2: Pills cascade --- */
      tl.from(S + '.pill',
        { y: 24, opacity: 0, duration: 0.35, stagger: { each: 0.2 }, ease: 'power2.out' },
        1.0
      );

      /* --- L3: Code card enters from right --- */
      tl.from(S + '.code-card',
        { x: 60, opacity: 0, duration: 0.6, ease: 'expo.out' },
        1.8
      );

      /* --- L3: Code lines reveal one by one --- */
      tl.from(S + '.code-line',
        { y: 8, opacity: 0, duration: 0.25, stagger: { each: 0.3 }, ease: 'power2.out' },
        2.5
      );

      /* --- L3: Cursor blink --- */
      tl.to(S + '.cursor-line',
        { opacity: 1, duration: 0.01 },
        3.0
      );
      tl.to(S + '.cursor-line',
        { opacity: 0, duration: 0.4, ease: 'steps(1)', yoyo: true, repeat: 9 },
        3.0
      );

      /* --- L3: Code card subtle float --- */
      tl.to(S + '.code-card',
        { y: -6, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: 1 },
        3.0
      );

      /* --- L2: Tagline fade in --- */
      tl.from(S + '.tagline',
        { opacity: 0, y: 16, duration: 0.5, ease: 'power2.out' },
        4.0
      );

      /* --- L4: Floating currency symbols drift in --- */
      tl.to(S + '.floater',
        { opacity: 0.08, duration: 1.2, stagger: { each: 0.25 }, ease: 'power1.out' },
        3.5
      );
      tl.to(S + '.f1', { y: -12, duration: 4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 3.5);
      tl.to(S + '.f2', { y: 10, duration: 3.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 3.8);
      tl.to(S + '.f3', { y: -8, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 4.0);
      tl.to(S + '.f4', { y: 14, duration: 3.8, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 3.6);
      tl.to(S + '.f5', { y: -10, duration: 3.2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 4.2);
      tl.to(S + '.f6', { y: 8, duration: 2.8, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 4.0);

      /* --- L6: Wave accent slow zoom --- */
      tl.fromTo(S + '.wave-accent',
        { scale: 1, opacity: 0 },
        { scale: 1.04, opacity: 0.35, duration: 8.6, ease: 'sine.inOut' },
        0
      );

      /* --- L7: Brand mark fade in --- */
      tl.to(S + '.brand-mark',
        { opacity: 1, duration: 0.8, ease: 'power2.out' },
        2.0
      );

      /* --- L2: Pills shimmer pulse --- */
      tl.to(S + '.pill',
        { scale: 1.03, duration: 0.6, stagger: 0.12, ease: 'sine.inOut', yoyo: true, repeat: 1 },
        5.0
      );

      /* --- Exit: velocity-matched upward + blur --- */
      tl.to(S + '.scene',
        { y: -150, opacity: 0, filter: 'blur(30px)', duration: 0.35, ease: 'power2.in' },
        8.25
      );

      window.__timelines['beat-2-product'] = tl;
    </script>
  </div>
</template>
